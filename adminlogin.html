<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Visioner48</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f3f5;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.12);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #075e54;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #pesan {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login Admin Visioner48</h2>

    <input
        id="email"
        type="email"
        placeholder="Email admin"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn" type="button">
        LOGIN
    </button>

    <div id="pesan"></div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /*
    =====================================
    FIREBASE CONFIG
    =====================================

    GANTI bagian di bawah dengan
    firebaseConfig milik project kamu.

    JANGAN membuat project Firebase baru.
    Pakai project yang sama dengan website
    Visioner48 kamu.
    */

const firebaseConfig = {
    apiKey: "AIzaSyDvHngeBgcjPgdIVtlR5w_3apGiornP-W4",
    authDomain: "visioner48-9b51e.firebaseapp.com",
    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "visioner48-9b51e",
    storageBucket: "visioner48-9b51e.firebasestorage.app",
    messagingSenderId: "691930246088",
    appId: "1:691930246088:web:efd50a623e8321d97feefd"
};

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const loginBtn =
        document.getElementById("loginBtn");


    const pesan =
        document.getElementById("pesan");


    loginBtn.addEventListener(
        "click",
        async function () {

            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            if (!email || !password) {

                pesan.textContent =
                    "Email dan password wajib diisi.";

                return;

            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "LOGIN...";

            pesan.textContent =
                "Sedang memproses login...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                pesan.textContent =
                    "Login berhasil. Membuka Admin...";


                window.location.href =
                    "admin.html";


            } catch (error) {

                console.error(error);


                pesan.textContent =
                    "Login gagal: " +
                    error.message;


                loginBtn.disabled = false;

                loginBtn.textContent =
                    "LOGIN";

            }

        }
    );

</script>

</body>
</html>
