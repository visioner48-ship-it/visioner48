<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Replay Live - Visioner48</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:#fff;
    min-height:100vh;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#000000,#180000,#b00000);
    padding:24px 15px;
    text-align:center;
    border-bottom:2px solid #e00020;
}

.header h1{
    font-size:27px;
}

.header p{
    margin-top:6px;
    color:#ccc;
    font-size:14px;
}

/* CONTAINER */
.container{
    width:92%;
    max-width:850px;
    margin:25px auto;
}

/* LOADING */
.loading{
    text-align:center;
    color:#aaa;
    padding:35px 10px;
}

/* LIST */
#daftarReplay{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

/* CARD */
.replay-card{
    background:#151515;
    border:1px solid #333;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.video{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

.video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

.info{
    padding:17px;
}

.info h2{
    font-size:18px;
    margin-bottom:9px;
    color:#fff;
}

.info p{
    color:#aaa;
    font-size:14px;
    line-height:1.5;
}

.tanggal{
    margin-top:10px;
    color:#777 !important;
    font-size:12px !important;
}

/* KOSONG */
.kosong{
    text-align:center;
    background:#151515;
    border:1px solid #333;
    border-radius:16px;
    padding:35px 15px;
    color:#888;
}

/* KEMBALI */
.kembali{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#222;
    color:#fff;
    padding:13px;
    border-radius:10px;
    margin:25px 0;
}

.kembali:hover{
    background:#333;
}
</style>
</head>

<body>

<div class="header">
    <h1>Visioner48</h1>
    <p>Replay Live</p>
</div>

<div class="container">

    <div id="daftarReplay">
        <div class="loading">
            Memuat Replay Live...
        </div>
    </div>

    <a href="index.html" class="kembali">
        ← Kembali ke Home
    </a>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "GANTI_DENGAN_API_KEY_KAMU",
    authDomain: "visioner48-9b51e.firebaseapp.com",
    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "visioner48-9b51e",
    storageBucket: "visioner48-9b51e.firebasestorage.app",
    messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
    appId: "GANTI_DENGAN_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const replayRef =
    db.ref("visioner48_replay");


/* =========================
   AMBIL DATA
========================= */

replayRef.on("value", function(snapshot){

    const daftar =
        document.getElementById("daftarReplay");

    daftar.innerHTML = "";


    if(!snapshot.exists()){

        daftar.innerHTML = `
            <div class="kosong">
                Belum ada Replay Live.
            </div>
        `;

        return;
    }


    const data = [];


    snapshot.forEach(function(child){

        data.push({
            key:child.key,
            ...child.val()
        });

    });


    /* Terbaru di atas */
    data.sort(function(a,b){

        return (b.waktu || 0) -
               (a.waktu || 0);

    });


    data.forEach(function(item){

        const card =
            document.createElement("div");

        card.className =
            "replay-card";


        card.innerHTML = `

            <div class="video">
                ${buatVideo(item.embed)}
            </div>

            <div class="info">

                <h2>
                    ${aman(item.judul || "Replay Live")}
                </h2>

                ${
                    item.deskripsi
                    ?
                    `<p>${aman(item.deskripsi)}</p>`
                    :
                    ""
                }

                ${
                    item.waktu
                    ?
                    `<p class="tanggal">
                        ${formatTanggal(item.waktu)}
                    </p>`
                    :
                    ""
                }

            </div>

        `;


        daftar.appendChild(card);

    });

}, function(error){

    document.getElementById("daftarReplay").innerHTML = `
        <div class="kosong">
            Gagal memuat Replay Live.<br><br>
            ${aman(error.message)}
        </div>
    `;

});


/* =========================
   VIDEO
========================= */

function buatVideo(link){

    if(!link){
        return "";
    }


    link = link.trim();


    /* Kalau sudah iframe */
    if(link.includes("<iframe")){

        return link;
    }


    let videoID = "";


    /* youtube.com/watch?v= */
    let match =
        link.match(/[?&]v=([^&#]+)/);

    if(match){

        videoID = match[1];

    }


    /* youtu.be/ */
    if(!videoID){

        match =
            link.match(/youtu\.be\/([^?&#]+)/);

        if(match){

            videoID = match[1];

        }

    }


    /* youtube.com/live/ */
    if(!videoID){

        match =
            link.match(/youtube\.com\/live\/([^?&#]+)/);

        if(match){

            videoID = match[1];

        }

    }


    /* youtube.com/embed/ */
    if(!videoID){

        match =
            link.match(/youtube\.com\/embed\/([^?&#]+)/);

        if(match){

            videoID = match[1];

        }

    }


    if(videoID){

        return `
            <iframe
                src="https://www.youtube.com/embed/${encodeURIComponent(videoID)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        `;

    }


    /* Kalau bukan link YouTube,
       coba langsung sebagai embed */

    return `
        <iframe
            src="${aman(link)}"
            allowfullscreen>
        </iframe>
    `;
}


/* =========================
   TANGGAL
========================= */

function formatTanggal(waktu){

    const tanggal =
        new Date(waktu);

    return tanggal.toLocaleDateString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================
   AMANKAN HTML
========================= */

function aman(teks){

    return String(teks)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
