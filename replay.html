 <!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Replay Live</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #ff1a1a;
    margin-bottom: 25px;
}

.replay-box {
    background: #151515;
    border: 1px solid #e00000;
    border-radius: 18px;
    padding: 20px;
}

.judul {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

iframe {
    width: 100%;
    height: 450px;
    border: none;
    border-radius: 15px;
}

.kosong {
    text-align: center;
    padding: 40px 20px;
    color: #aaa;
}

.kembali {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    border: 1px solid #e00000;
    border-radius: 10px;
    color: white;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    iframe {
        height: 230px;
    }

    .judul {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>
    Replay Live
</h1>

<div
    id="replay"
    class="replay-box">
    
    <div class="kosong">
        Memuat Replay Live...
    </div>

</div>

<a
    href="index.html"
    class="kembali"
>
    Kembali
</a>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "ISI_API_KEY_KAMU",

    authDomain: "visioner48-9b51e.firebaseapp.com",

    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "visioner48-9b51e",

    storageBucket: "visioner48-9b51e.appspot.com",

    messagingSenderId: "ISI_MESSAGING_SENDER_ID",

    appId: "ISI_APP_ID"

};


/* =========================
   INIT FIREBASE
========================= */

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/* =========================
   TAMPILKAN REPLAY
========================= */

function tampilkanReplay() {

    const replay =
        document.getElementById("replay");


    database
        .ref("visioner48_replay")
        .on("value", function(snapshot) {

            const item = snapshot.val();


            if (!item) {

                replay.innerHTML = `

                    <div class="kosong">

                        Belum ada Replay Live.

                    </div>

                `;

                return;
            }


            if (!item.embedUrl) {

                replay.innerHTML = `

                    <div class="kosong">

                        Replay tidak tersedia.

                    </div>

                `;

                return;
            }


            replay.innerHTML = `

                <div class="judul">

                    ${escapeHtml(
                        item.judul || "Replay Live"
                    )}

                </div>


                <iframe

                    src="${escapeAttribute(
                        item.embedUrl
                    )}"

                    title="Replay Live"

                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

                    allowfullscreen>

                </iframe>

            `;

        }, function(error) {

            console.error(error);

            replay.innerHTML = `

                <div class="kosong">

                    Gagal membaca Replay Live.

                </div>

            `;

        });

}


/* =========================
   AMANKAN JUDUL
========================= */

function escapeHtml(teks) {

    const div =
        document.createElement("div");

    div.textContent =
        teks;

    return div.innerHTML;

}


/* =========================
   AMANKAN URL
========================= */

function escapeAttribute(teks) {

    return String(teks)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================
   MULAI
========================= */

tampilkanReplay();

</script>

</body>

</html>
