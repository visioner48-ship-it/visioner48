<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Visioner48</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    max-width: 500px;
    margin: 40px auto;
    padding: 25px;
    background: #151515;
    border: 1px solid #e00000;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #ff2020;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #e00000;
    border-radius: 12px;
    background: #1c1c1c;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    background: #e00000;
}

.keluar {
    margin-top: 25px;
    background: #e00000;
}
</style>
</head>

<body>

<div class="box">

    <h1>Admin Visioner48</h1>

    <button onclick="location.href='admin-replay.html'">
        🎬 Replay Live
    </button>

    <button onclick="location.href='admin-news.html'">
        📰 News
    </button>

    <button onclick="location.href='admin-schedule.html'">
        📅 Schedule
    </button>

    <button onclick="location.href='admin-question.html'">
        💬 Pertanyaan
    </button>

    <button class="keluar" onclick="location.href='index.html'">
        Kembali ke Home
    </button>

</div>

</body>
</html>
