<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Replay Live - Visioner48</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#000000,#180000,#b00000);
    padding:22px 15px;
    text-align:center;
    border-bottom:2px solid #e00020;
}

.header h1{
    font-size:26px;
}

.header p{
    margin-top:6px;
    color:#ccc;
}

.container{
    width:92%;
    max-width:700px;
    margin:25px auto;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    color:#ff3048;
    margin-bottom:18px;
}

label{
    display:block;
    margin:13px 0 7px;
    color:#ddd;
    font-size:14px;
}

input,textarea{
    width:100%;
    background:#0b0b0b;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:13px;
    font-size:14px;
    outline:none;
}

input:focus,textarea:focus{
    border-color:#e00020;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    font-weight:bold;
}

.simpan{
    width:100%;
    margin-top:16px;
    background:#d71935;
    color:white;
    font-size:15px;
}

.batal{
    width:100%;
    margin-top:10px;
    background:#333;
    color:white;
    display:none;
}

.item{
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.item h3{
    margin-bottom:8px;
}

.item p{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
    word-break:break-word;
}

.aksi{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.aksi button{
    flex:1;
    color:white;
}

.edit{
    background:#805d00;
}

.hapus{
    background:#a9001b;
}

.status{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    text-align:center;
    font-size:13px;
}

.ok{
    display:block;
    background:#123c1d;
    color:#8cff9b;
}

.gagal{
    display:block;
    background:#48131b;
    color:#ff9aa7;
}

.kosong{
    text-align:center;
    color:#777;
    padding:20px 5px;
}

.kembali{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#222;
    padding:13px;
    border-radius:10px;
    margin-bottom:25px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Visioner48</h1>
    <p>Admin Replay Live</p>
</div>

<div class="container">

    <div class="card">

        <h2 id="judulForm">Tambah Replay Live</h2>

        <label>Judul Replay</label>
        <input
            type="text"
            id="judul"
            placeholder="Contoh: JKT48 Theater"
        >

        <label>Link / Embed Video</label>
        <input
            type="text"
            id="embed"
            placeholder="Masukkan link YouTube"
        >

        <label>Deskripsi</label>
        <textarea
            id="deskripsi"
            placeholder="Deskripsi Replay Live"
        ></textarea>

        <button
            class="simpan"
            id="btnSimpan"
            onclick="simpanReplay()"
        >
            + Tambah Replay Live
        </button>

        <button
            class="batal"
            id="btnBatal"
            onclick="batalEdit()"
        >
            Batal Edit
        </button>

        <div id="status" class="status"></div>

    </div>

    <div class="card">

        <h2>Daftar Replay Live</h2>

        <div id="daftar">
            <div class="kosong">Memuat Replay Live...</div>
        </div>

    </div>

    <a href="admin.html" class="kembali">
        ← Kembali ke Admin
    </a>

</div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "GANTI_DENGAN_API_KEY_KAMU",
    authDomain: "visioner48-9b51e.firebaseapp.com",
    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "visioner48-9b51e",
    storageBucket: "visioner48-9b51e.firebasestorage.app",
    messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
    appId: "GANTI_DENGAN_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const replayRef = db.ref("visioner48_replay");

let editKey = null;


/* =========================
   STATUS
========================= */

function statusPesan(teks, berhasil){

    const box = document.getElementById("status");

    box.textContent = teks;

    box.className =
        "status " + (berhasil ? "ok" : "gagal");

    setTimeout(function(){

        box.className = "status";

    },3000);
}


/* =========================
   TAMBAH / EDIT
========================= */

function simpanReplay(){

    const judul =
        document.getElementById("judul").value.trim();

    const embed =
        document.getElementById("embed").value.trim();

    const deskripsi =
        document.getElementById("deskripsi").value.trim();


    if(!judul){
        statusPesan("Judul Replay belum diisi.",false);
        return;
    }

    if(!embed){
        statusPesan("Link video belum diisi.",false);
        return;
    }


    const data = {
        judul: judul,
        embed: embed,
        deskripsi: deskripsi,
        waktu: Date.now()
    };


    if(editKey){

        replayRef.child(editKey).update(data)
        .then(function(){

            statusPesan(
                "Replay Live berhasil diperbarui.",
                true
            );

            batalEdit();

        })
        .catch(function(error){

            statusPesan(
                "Gagal menyimpan: " + error.message,
                false
            );

        });

    }else{

        replayRef.push(data)
        .then(function(){

            statusPesan(
                "Replay Live berhasil ditambahkan.",
                true
            );

            kosongkanForm();

        })
        .catch(function(error){

            statusPesan(
                "Gagal menambahkan: " + error.message,
                false
            );

        });

    }

}


/* =========================
   BACA DATA FIREBASE
========================= */

replayRef.on("value", function(snapshot){

    const daftar =
        document.getElementById("daftar");

    daftar.innerHTML = "";

    if(!snapshot.exists()){

        daftar.innerHTML =
            '<div class="kosong">Belum ada Replay Live.</div>';

        return;
    }


    const data = [];

    snapshot.forEach(function(child){

        data.push({
            key: child.key,
            ...child.val()
        });

    });


    data.reverse();


    data.forEach(function(item){

        const div =
            document.createElement("div");

        div.className = "item";


        div.innerHTML = `

            <h3>${aman(item.judul || "Tanpa Judul")}</h3>

            <p>
                ${aman(item.deskripsi || "Tidak ada deskripsi")}
            </p>

            <p>
                Link: ${aman(item.embed || "-")}
            </p>

            <div class="aksi">

                <button
                    class="edit"
                    onclick="editReplay('${item.key}')"
                >
                    Edit
                </button>

                <button
                    class="hapus"
                    onclick="hapusReplay('${item.key}')"
                >
                    Hapus
                </button>

            </div>
        `;

        daftar.appendChild(div);

    });

}, function(error){

    document.getElementById("daftar").innerHTML =
        '<div class="kosong">Gagal membaca Replay Live: ' +
        aman(error.message) +
        '</div>';

});


/* =========================
   EDIT
========================= */

function editReplay(key){

    replayRef.child(key).once("value")
    .then(function(snapshot){

        if(!snapshot.exists()) return;

        const item = snapshot.val();

        editKey = key;

        document.getElementById("judul").value =
            item.judul || "";

        document.getElementById("embed").value =
            item.embed || "";

        document.getElementById("deskripsi").value =
            item.deskripsi || "";

        document.getElementById("judulForm").textContent =
            "Edit Replay Live";

        document.getElementById("btnSimpan").textContent =
            "Simpan Perubahan";

        document.getElementById("btnBatal").style.display =
            "block";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    });

}


/* =========================
   HAPUS
========================= */

function hapusReplay(key){

    if(!confirm("Hapus Replay Live ini?")){
        return;
    }

    replayRef.child(key).remove()
    .then(function(){

        statusPesan(
            "Replay Live berhasil dihapus.",
            true
        );

    })
    .catch(function(error){

        statusPesan(
            "Gagal menghapus: " + error.message,
            false
        );

    });

}


/* =========================
   BATAL EDIT
========================= */

function batalEdit(){

    editKey = null;

    kosongkanForm();

    document.getElementById("judulForm").textContent =
        "Tambah Replay Live";

    document.getElementById("btnSimpan").textContent =
        "+ Tambah Replay Live";

    document.getElementById("btnBatal").style.display =
        "none";

}


/* =========================
   KOSONGKAN
========================= */

function kosongkanForm(){

    document.getElementById("judul").value = "";

    document.getElementById("embed").value = "";

    document.getElementById("deskripsi").value = "";

}


/* =========================
   AMANKAN HTML
========================= */

function aman(teks){

    return String(teks)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
