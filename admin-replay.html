 <!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Replay Live</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

.box {
    background: #151515;
    border: 1px solid #e00000;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
}

h1 {
    margin-top: 0;
    text-align: center;
    color: #ff1a1a;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #444;
    border-radius: 10px;
    background: #222;
    color: white;
    outline: none;
}

input:focus {
    border-color: #e00000;
}

#preview {
    display: none;
    width: 100%;
    height: 300px;
    margin-top: 20px;
    border: none;
    border-radius: 15px;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #222;
    border-radius: 10px;
    text-align: center;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.simpan {
    background: #e00000;
    color: white;
}

.hapus {
    background: #333;
    color: white;
}

.kembali {
    background: transparent;
    border: 1px solid #e00000;
    color: white;
}

button:hover {
    opacity: 0.85;
}

</style>

</head>


<body>

<div class="container">

<div class="box">

<h1>
    Admin Replay Live
</h1>


<label>
    Judul Replay
</label>

<input
    type="text"
    id="judul"
    placeholder="Masukkan judul replay"
/>


<label>
    Link Video YouTube
</label>

<input
    type="text"
    id="youtubeUrl"
    placeholder="Masukkan link YouTube"
/>


<iframe
    id="preview"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
</iframe>


<div
    id="status"
    class="status">
</div>


<button
    class="simpan"
    onclick="simpanReplay()"
>
    Simpan Replay
</button>


<button
    class="hapus"
    onclick="hapusReplay()"
>
    Hapus Replay
</button>


<button
    class="kembali"
    onclick="kembaliAdmin()"
>
    Kembali Admin
</button>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "ISI_API_KEY_KAMU",

    authDomain: "visioner48-9b51e.firebaseapp.com",

    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "visioner48-9b51e",

    storageBucket: "visioner48-9b51e.appspot.com",

    messagingSenderId: "ISI_MESSAGING_SENDER_ID",

    appId: "ISI_APP_ID"

};


/* =========================
   INIT FIREBASE
========================= */

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/*
   AMBIL LINK YOUTUBE
*/

function getYoutubeId(link) {

    try {

        const url =
            new URL(link);

        let id = "";


        if (
            url.hostname.includes("youtu.be")
        ) {

            id =
                url.pathname
                    .substring(1)
                    .split("/")[0];

        }


        else if (
            url.hostname.includes("youtube.com")
        ) {

            if (
                url.pathname === "/watch"
            ) {

                id =
                    url.searchParams.get("v") || "";

            }


            else if (
                url.pathname.startsWith("/shorts/")
            ) {

                id =
                    url.pathname
                        .split("/")[2] || "";

            }


            else if (
                url.pathname.startsWith("/embed/")
            ) {

                id =
                    url.pathname
                        .split("/")[2] || "";

            }

        }


        return id;

    }

    catch {

        return "";

    }

}


/*
   SIMPAN REPLAY KE FIREBASE
*/

function simpanReplay() {

    const judul =
        document
            .getElementById("judul")
            .value
            .trim();


    const youtubeUrl =
        document
            .getElementById("youtubeUrl")
            .value
            .trim();


    if (!judul) {

        tampilkanStatus(
            "Judul belum diisi."
        );

        return;
    }


    if (!youtubeUrl) {

        tampilkanStatus(
            "Link YouTube belum diisi."
        );

        return;
    }


    const videoId =
        getYoutubeId(youtubeUrl);


    if (!videoId) {

        tampilkanStatus(
            "Link YouTube tidak valid."
        );

        return;
    }


    const replay = {

        judul:
            judul,

        youtubeUrl:
            youtubeUrl,

        videoId:
            videoId,

        embedUrl:
            "https://www.youtube.com/embed/" +
            videoId

    };


    database
        .ref("visioner48_replay")
        .set(replay)
        .then(function() {

            tampilkanPreview(
                replay.embedUrl
            );


            tampilkanStatus(
                "Replay berhasil disimpan."
            );

        })

        .catch(function(error) {

            console.error(error);

            tampilkanStatus(
                "Gagal menyimpan Replay: " +
                error.message
            );

        });

}


/*
   TAMPILKAN PREVIEW
*/

function tampilkanPreview(
    embedUrl
) {

    const preview =
        document.getElementById(
            "preview"
        );


    preview.src =
        embedUrl;


    preview.style.display =
        "block";

}


/*
   HAPUS REPLAY
*/

function hapusReplay() {

    const yakin =
        confirm(
            "Yakin ingin menghapus replay?"
        );


    if (!yakin) {

        return;

    }


    database
        .ref("visioner48_replay")
        .remove()
        .then(function() {

            document
                .getElementById("judul")
                .value = "";


            document
                .getElementById("youtubeUrl")
                .value = "";


            const preview =
                document.getElementById(
                    "preview"
                );


            preview.src = "";

            preview.style.display =
                "none";


            tampilkanStatus(
                "Replay berhasil dihapus."
            );

        })

        .catch(function(error) {

            console.error(error);

            tampilkanStatus(
                "Gagal menghapus Replay: " +
                error.message
            );

        });

}


/*
   STATUS
*/

function tampilkanStatus(
    teks
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        teks;


    status.style.display =
        "block";

}


/*
   LOAD DATA DARI FIREBASE
*/

function loadReplay() {

    database
        .ref("visioner48_replay")
        .once("value")
        .then(function(snapshot) {

            const replay =
                snapshot.val();


            if (!replay) {

                return;

            }


            document
                .getElementById("judul")
                .value =
                replay.judul || "";


            document
                .getElementById("youtubeUrl")
                .value =
                replay.youtubeUrl || "";


            if (replay.embedUrl) {

                tampilkanPreview(
                    replay.embedUrl
                );

            }

        })

        .catch(function(error) {

            console.error(
                "Gagal memuat Replay:",
                error
            );

        });

}


/*
   KEMBALI ADMIN
*/

function kembaliAdmin() {

    window.location.href =
        "admin.html";

}


/*
   MULAI
*/

loadReplay();

</script>

</body>

</html>
