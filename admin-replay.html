 <!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Replay Live</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

.box {
    background: #151515;
    border: 1px solid #e00000;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
}

h1 {
    margin-top: 0;
    text-align: center;
    color: #ff1a1a;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #444;
    border-radius: 10px;
    background: #222;
    color: white;
    outline: none;
}

input:focus {
    border-color: #e00000;
}

#preview {
    display: none;
    width: 100%;
    height: 300px;
    margin-top: 20px;
    border: none;
    border-radius: 15px;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #222;
    border-radius: 10px;
    text-align: center;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.simpan {
    background: #e00000;
    color: white;
}

.hapus {
    background: #333;
    color: white;
}

.kembali {
    background: transparent;
    border: 1px solid #e00000;
    color: white;
}

button:hover {
    opacity: 0.85;
}

</style>

</head>


<body>

<div class="container">

<div class="box">

<h1>
Admin Replay Live
</h1>


<label>
Judul Replay
</label>

<input
    type="text"
    id="judul"
    placeholder="Masukkan judul replay"
/>


<label>
Link Video YouTube
</label>

<input
    type="text"
    id="youtubeUrl"
    placeholder="Masukkan link YouTube"
/>


<iframe
    id="preview"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
</iframe>


<div
    id="status"
    class="status">
</div>


<button
    class="simpan"
    onclick="simpanReplay()"
>
    Simpan Replay
</button>


<button
    class="hapus"
    onclick="hapusReplay()"
>
    Hapus Replay
</button>


<button
    class="kembali"
    onclick="kembaliAdmin()"
>
    Kembali Admin
</button>

</div>

</div>


<script>

/*
   AMBIL LINK YOUTUBE
*/

function getYoutubeId(link) {

    try {

        const url =
            new URL(link);

        let id = "";


        if (
            url.hostname.includes(
                "youtu.be"
            )
        ) {

            id =
                url.pathname
                    .substring(1)
                    .split("/")[0];

        }


        else if (
            url.hostname.includes(
                "youtube.com"
            )
        ) {

            if (
                url.pathname ===
                "/watch"
            ) {

                id =
                    url.searchParams.get(
                        "v"
                    ) || "";

            }


            else if (
                url.pathname.startsWith(
                    "/shorts/"
                )
            ) {

                id =
                    url.pathname
                        .split("/")[2] || "";

            }


            else if (
                url.pathname.startsWith(
                    "/embed/"
                )
            ) {

                id =
                    url.pathname
                        .split("/")[2] || "";

            }

        }


        return id;

    }

    catch {

        return "";

    }

}


/*
   SIMPAN REPLAY
*/

function simpanReplay() {

    const judul =
        document
            .getElementById("judul")
            .value
            .trim();


    const youtubeUrl =
        document
            .getElementById("youtubeUrl")
            .value
            .trim();


    if (!judul) {

        tampilkanStatus(
            "Judul belum diisi."
        );

        return;
    }


    if (!youtubeUrl) {

        tampilkanStatus(
            "Link YouTube belum diisi."
        );

        return;
    }


    const videoId =
        getYoutubeId(
            youtubeUrl
        );


    if (!videoId) {

        tampilkanStatus(
            "Link YouTube tidak valid."
        );

        return;
    }


    const replay = {

        judul:
            judul,

        youtubeUrl:
            youtubeUrl,

        videoId:
            videoId,

        embedUrl:
            "https://www.youtube.com/embed/" +
            videoId

    };


    localStorage.setItem(
        "visioner48Replay",
        JSON.stringify(
            replay
        )
    );


    tampilkanPreview(
        replay.embedUrl
    );


    tampilkanStatus(
        "Replay berhasil disimpan."
    );

}


/*
   TAMPILKAN PREVIEW
*/

function tampilkanPreview(
    embedUrl
) {

    const preview =
        document.getElementById(
            "preview"
        );


    preview.src =
        embedUrl;


    preview.style.display =
        "block";

}


/*
   HAPUS REPLAY
*/

function hapusReplay() {

    const yakin =
        confirm(
            "Yakin ingin menghapus replay?"
        );


    if (!yakin) {

        return;

    }


    localStorage.removeItem(
        "visioner48Replay"
    );


    document
        .getElementById(
            "judul"
        )
        .value = "";


    document
        .getElementById(
            "youtubeUrl"
        )
        .value = "";


    const preview =
        document.getElementById(
            "preview"
        );


    preview.src = "";

    preview.style.display =
        "none";


    tampilkanStatus(
        "Replay berhasil dihapus."
    );

}


/*
   STATUS
*/

function tampilkanStatus(
    teks
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        teks;


    status.style.display =
        "block";

}


/*
   LOAD DATA
*/

function loadReplay() {

    const data =
        localStorage.getItem(
            "visioner48Replay"
        );


    if (!data) {

        return;

    }


    try {

        const replay =
            JSON.parse(
                data
            );


        document
            .getElementById(
                "judul"
            )
            .value =
            replay.judul || "";


        document
            .getElementById(
                "youtubeUrl"
            )
            .value =
            replay.youtubeUrl || "";


        if (
            replay.embedUrl
        ) {

            tampilkanPreview(
                replay.embedUrl
            );

        }

    }

    catch {

        localStorage.removeItem(
            "visioner48Replay"
        );

    }

}


/*
   KEMBALI ADMIN
*/

function kembaliAdmin() {

    window.location.href =
        "admin.html";

}


loadReplay();

</script>

</body>

</html>
