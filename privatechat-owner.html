<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visioner48 Private Chat Owner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .header {
            background: #111;
            color: white;
            padding: 18px 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 15px;
        }

        .home {
            display: block;
            margin: 0 auto 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
        }

        .title {
            text-align: center;
            margin: 15px 0;
        }

        .profiles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .profile {
            background: white;
            padding: 12px 8px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .profile img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
        }

        .name {
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        .number {
            margin-top: 4px;
            color: #777;
            font-size: 11px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 600px) {
            .profiles {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 420px) {
            .profiles {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="header">
    Visioner48 Private Chat Owner
</div>

<div class="container">

    <button class="home" onclick="kembaliKeHome()">
        Kembali ke Home
    </button>

    <h2 class="title">
        60 Private Chat Member
    </h2>

    <div id="profiles" class="profiles">
        <div class="loading">
            Memuat profil...
        </div>
    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

firebase.initializeApp(firebaseConfig);

const database =
    firebase.database();

const profiles =
    document.getElementById("profiles");

const defaultPhoto =
    "https://via.placeholder.com/150";


function tampilkanProfil() {

    profiles.innerHTML = "";

    for (
        let nomor = 1;
        nomor <= 60;
        nomor++
    ) {

        const card =
            document.createElement("div");

        card.className =
            "profile";

        card.innerHTML = `

            <img
                id="foto${nomor}"
                src="${defaultPhoto}"
                alt="Member ${nomor}"
            >

            <div
                id="nama${nomor}"
                class="name"
            >
                Member ${nomor}
            </div>

            <div class="number">
                Profil ${nomor}
            </div>

        `;

        card.onclick = function() {

            bukaChat(nomor);

        };

        profiles.appendChild(card);


        database
            .ref(
                "visioner48_profiles/member" +
                nomor
            )
            .on(
                "value",
                function(snapshot) {

                    const data =
                        snapshot.val();

                    if (!data) {
                        return;
                    }


                    if (data.nama) {

                        document.getElementById(
                            "nama" + nomor
                        ).textContent =
                            data.nama;

                    }


                    if (data.foto) {

                        document.getElementById(
                            "foto" + nomor
                        ).src =
                            data.foto;

                    }

                }
            );
    }
}


function bukaChat(nomor) {

    window.location.href =
        "privatechat.html?member=member" +
        nomor;

}


function kembaliKeHome() {

    window.location.href =
        "index.html";

}

tampilkanProfil();

</script>

</body>
</html>
