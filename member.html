.title {

.title p {
    color: white;

/* GRID MEMBER */

.members {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 15px;

    max-width: 1200px;

    margin: auto;

    padding: 20px;
}

/* KARTU MEMBER */

.member {
    background:
        rgba(
            255,
            255,
            255,
            0.10
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.18
        );

    color: white;

    text-decoration: none;

    padding: 8px;

    border-radius: 20px;

    text-align: center;

    transition: 0.2s;
}

.member:hover {
    transform:
        translateY(-4px);

    background:
        rgba(
            255,
            255,
            255,
            0.17
        );
}

/* FOTO */

.member img {
    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 15px;
