<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>News - Visioner48</title>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #312E81
        );

    color: white;

    min-height: 100vh;
}


.header {
    text-align: center;

    padding: 30px 15px;
}


.header h1 {
    margin: 0;

    font-size: 30px;
}


.header p {
    color: #d1d5db;
}


.container {
    width: 94%;

    max-width: 700px;

    margin: auto;
}


/* =========================
   TOMBOL HOME
========================= */

#tombolHome,
#tombolKembaliDetail {

    display: block;

    width: 100%;

    padding: 13px;

    margin-bottom: 20px;

    border: none;

    border-radius: 12px;

    background: #e91e63;

    color: white;

    text-decoration: none;

    text-align: center;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


#tombolKembaliDetail {

    display: none;

    background: #4b5563;
}


/* =========================
   DAFTAR BERITA
========================= */

.berita-card {

    background: #1f2937;

    border-radius: 16px;

    overflow: hidden;

    margin-bottom: 18px;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.25);

    transition: 0.2s;
}


.berita-card:active {

    transform:
        scale(0.98);
}


.berita-foto {

    width: 100%;

    height: 220px;

    object-fit: cover;

    display: block;
}


.berita-info {

    padding: 17px;
}


.berita-judul {

    margin:
        0 0 8px;

    font-size: 20px;
}


.berita-tanggal {

    color: #9ca3af;

    font-size: 13px;

    margin-bottom: 10px;
}


.berita-ringkas {

    color: #e5e7eb;

    line-height: 1.6;
}


.kosong {

    background: #1f2937;

    padding: 30px 20px;

    border-radius: 16px;

    text-align: center;
}


/* =========================
   DETAIL
========================= */

#detail {

    display: none;
}


.detail-box {

    background: #1f2937;

    padding: 20px;

    border-radius: 16px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.25);
}


#detailFoto {

    width: 100%;

    max-height: 400px;

    object-fit: cover;

    border-radius: 14px;

    margin-bottom: 20px;

    display: none;
}


#detailJudul {

    margin:
        0 0 8px;

    font-size: 26px;
}


#detailTanggal {

    color: #9ca3af;

    font-size: 14px;

    margin-bottom: 20px;
}


#detailIsi {

    color: #f3f4f6;

    line-height: 1.8;

    white-space: pre-wrap;

    font-size: 16px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 480px) {

    .header {

        padding:
            25px 10px;

    }


    .header h1 {

        font-size: 26px;

    }


    .berita-foto {

        height: 190px;

    }


    .berita-judul {

        font-size: 18px;

    }


    #detailJudul {

        font-size: 22px;

    }

}

</style>

</head>


<body>


<div class="header">

    <h1 id="judulHalaman">
        News
    </h1>

    <p id="subjudul">
        Berita dan informasi Visioner48
    </p>

</div>


<div class="container">


<a
    id="tombolHome"
    href="../index.html"
>
    Kembali ke Home
</a>


<button
    id="tombolKembaliDetail"
    onclick="kembaliKeDaftar()"
>
    Kembali ke Daftar Berita
</button>


<!-- =========================
     DAFTAR BERITA
========================= -->

<div id="daftarBerita">

    <div class="kosong">

        <h2>
            Memuat berita...
        </h2>

    </div>

</div>


<!-- =========================
     DETAIL BERITA
========================= -->

<div id="detail">

    <div class="detail-box">

        <img
            id="detailFoto"
            alt="Foto berita"
        >


        <h1 id="detailJudul">
            Judul Berita
        </h1>


        <div id="detailTanggal">
            Tanggal
        </div>


        <div id="detailIsi">
            Isi berita
        </div>

    </div>

</div>


</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDvHngeBgcjPgdIVtlR5w_3apGiornP-W4",

    authDomain:
        "visioner48-9b51e.firebaseapp.com",

    databaseURL:
        "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
        "visioner48-9b51e",

    storageBucket:
        "visioner48-9b51e.firebasestorage.app",

    messagingSenderId:
        "691930246088",

    appId:
        "1:691930246088:web:efd50a623e8321d97feefd"

};


firebase.initializeApp(
    firebaseConfig
);


const database =
    firebase.database();


const beritaRef =
    database.ref(
        "visioner48_news"
    );


/* =========================================
   TAMPILKAN DAFTAR BERITA
========================================= */

function tampilkanDaftar() {

    const container =
        document.getElementById(
            "daftarBerita"
        );


    container.innerHTML = `

        <div class="kosong">

            <h2>
                Memuat berita...
            </h2>

        </div>

    `;


    beritaRef
        .once("value")

        .then(
            function(snapshot) {

                container.innerHTML =
                    "";


                const data =
                    snapshot.val();


                if (!data) {

                    container.innerHTML = `

                        <div class="kosong">

                            <h2>
                                Belum Ada Berita
                            </h2>

                            <p>
                                Admin belum menambahkan berita.
                            </p>

                        </div>

                    `;

                    return;
                }


                const berita =
                    Object.values(data);


                /* Berita terbaru paling atas */

                berita.sort(
                    function(a, b) {

                        return (
                            (b.waktu || 0) -
                            (a.waktu || 0)
                        );

                    }
                );


                berita.forEach(
                    function(item) {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "berita-card";


                        let foto = "";


                        if (
                            item.gambar &&
                            item.gambar !== ""
                        ) {

                            foto = `

                                <img
                                    class="berita-foto"
                                    src="${item.gambar}"
                                    alt="Foto berita"
                                >

                            `;

                        }


                        let ringkas =
                            item.isi || "";


                        if (
                            ringkas.length > 160
                        ) {

                            ringkas =
                                ringkas.substring(
                                    0,
                                    160
                                ) + "...";

                        }


                        card.innerHTML = `

                            ${foto}

                            <div class="berita-info">

                                <h2
                                    class="berita-judul"
                                >
                                    ${escapeHTML(
                                        item.judul ||
                                        "Tanpa Judul"
                                    )}
                                </h2>


                                <div
                                    class="berita-tanggal"
                                >
                                    ${escapeHTML(
                                        item.tanggal ||
                                        ""
                                    )}
                                </div>


                                <div
                                    class="berita-ringkas"
                                >
                                    ${escapeHTML(
                                        ringkas
                                    )}
                                </div>

                            </div>

                        `;


                        card.onclick =
                            function() {

                                tampilkanDetail(
                                    item
                                );

                            };


                        container.appendChild(
                            card
                        );

                    }
                );

            }
        )

        .catch(
            function(error) {

                container.innerHTML = `

                    <div class="kosong">

                        <h2>
                            Gagal Memuat Berita
                        </h2>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }
        );

}


/* =========================================
   TAMPILKAN DETAIL
========================================= */

function tampilkanDetail(item) {


    /* Sembunyikan daftar */

    document.getElementById(
        "daftarBerita"
    ).style.display =
        "none";


    /* Tampilkan detail */

    document.getElementById(
        "detail"
    ).style.display =
        "block";


    /* Judul halaman */

    document.getElementById(
        "judulHalaman"
    ).textContent =
        "Detail News";


    document.getElementById(
        "subjudul"
    ).textContent =
        "Visioner48";


    /* Judul berita */

    document.getElementById(
        "detailJudul"
    ).textContent =
        item.judul ||
        "Tanpa Judul";


    /* Tanggal */

    document.getElementById(
        "detailTanggal"
    ).textContent =
        item.tanggal ||
        "";


    /* Isi berita */

    document.getElementById(
        "detailIsi"
    ).textContent =
        item.isi ||
        "";


    /* Foto */

    const foto =
        document.getElementById(
            "detailFoto"
        );


    if (
        item.gambar &&
        item.gambar !== ""
    ) {

        foto.src =
            item.gambar;

        foto.style.display =
            "block";

    } else {

        foto.style.display =
            "none";

    }


    /* Tombol */

    document.getElementById(
        "tombolKembaliDetail"
    ).style.display =
        "block";


    document.getElementById(
        "tombolHome"
    ).style.display =
        "none";

}


/* =========================================
   KEMBALI KE DAFTAR
========================================= */

function kembaliKeDaftar() {


    document.getElementById(
        "detail"
    ).style.display =
        "none";


    document.getElementById(
        "daftarBerita"
    ).style.display =
        "block";


    document.getElementById(
        "judulHalaman"
    ).textContent =
        "News";


    document.getElementById(
        "subjudul"
    ).textContent =
        "Berita dan informasi Visioner48";


    document.getElementById(
        "tombolKembaliDetail"
    ).style.display =
        "none";


    document.getElementById(
        "tombolHome"
    ).style.display =
        "block";

}


/* =========================================
   HOME
========================================= */

function kembaliHome() {

    window.location.href =
        "../index.html";

}


/* =========================================
   AMANKAN TEKS
========================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   MULAI
========================================= */

tampilkanDaftar();

</script>


</body>

</html>
