.detail{

#fotoMember{

}

/* NAMA LENGKAP */

.nama-lengkap{

}

.nama-lengkap h2{

    font-size:14px;
    color:#ff5a5a;
    text-transform:uppercase;
    letter-spacing:1px;
}

.nama-lengkap p{
    margin:0;
    font-size:21px;
    font-weight:bold;
}

/* BAGIAN */

.section{
    margin-top:20px;
    padding:18px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(220,20,20,.3);
    border-radius:15px;
    text-align:left;
}

.section-title{
    margin:0 0 15px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(220,20,20,.3);
    color:#ff4d4d;
    font-size:18px;

/* BIODATA */

.biodata{
    text-align:left;
    line-height:1.8;
    color:white;
}

.biodata p{
    margin:8px 0;
}

.biodata b{
    color:#ff5a5a;
}

/* SOCIAL MEDIA */

.social{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-button{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    border-radius:12px;
    background:
    linear-gradient(
        135deg,
        rgba(100,0,0,.5),
        rgba(20,20,20,.8)
    );
    border:1px solid rgba(220,20,20,.35);
    color:white;
    text-decoration:none;
    transition:.2s;
    min-height:55px;
}

.social-button:hover{
    background:
    linear-gradient(
        135deg,
        #b00000,
        #250000
    );
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(150,0,0,.35);
}

.social-icon{
    width:34px;
    height:34px;
    min-width:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:#b00000;
    color:white;
    font-size:19px;
    font-weight:bold;

.social-name{
    font-size:14px;
    font-weight:bold;
}

.social-username{
    display:block;
    margin-top:3px;
    font-size:11px;
    color:#aaa;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

.jiko h3{

    .social{

}

/* ==================================================

   ================================================== */

function setSocial(linkId, textId, url) {

    const link = document.getElementById(linkId);
    const text = document.getElementById(textId);

    if (!url || url === "#") {
        link.style.display = "none";
        return;
    }

    link.style.display = "flex";
    text.textContent = url;
    link.href = url;
}
