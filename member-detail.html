                    255,
                    255,

                    20,
                    20,
                    0.30

            margin-top: 20px;

            line-height: 1.7;
        }

            margin-top: 20px;

            background:

                    135deg,
                    #8b0000,
                    #d00000

            border-radius: 12px;

                    #b00000,
