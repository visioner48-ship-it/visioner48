<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visioner48 - Admin Schedule</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

.header {
    background: linear-gradient(135deg, #000000, #180000, #b00000);
    padding: 25px 15px;
    text-align: center;
    border-bottom: 2px solid #d00000;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
    color: #ccc;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px 15px 50px;
}

.back {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #b00000;
    padding: 11px 17px;
    border-radius: 9px;
    font-weight: bold;
    margin-bottom: 20px;
}

.form-box,
.list-box {
    background: #111;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    color: #bbb;
    font-size: 13px;
    margin: 15px 0 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #080808;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #d00000;
}

/* TOMBOL GALERI */
.gallery-button {
    display: block;
    width: 100%;
    padding: 14px;
    background: #b00000;
    color: white;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.gallery-button:hover {
    background: #df0000;
}

#imageFile {
    display: none;
}

.preview {
    margin-top: 12px;
    display: none;
    text-align: center;
}

.preview img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid #b00000;
}

.image-status {
    margin-top: 8px;
    color: #aaa;
    font-size: 12px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 12px 16px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.save {
    width: 100%;
    background: #c00000;
    margin-top: 20px;
}

.save:hover {
    background: #e00000;
}

.cancel {
    width: 100%;
    background: #444;
    margin-top: 10px;
    display: none;
}

.add-member {
    width: 100%;
    background: #292929;
    margin-top: 10px;
}

.member-row {
    display: grid;
    grid-template-columns: 1fr 1fr 45px;
    gap: 8px;
    margin-bottom: 9px;
}

.remove-member {
    background: #700000;
    padding: 8px;
}

.schedule-item {
    border: 1px solid #303030;
    background: #0b0b0b;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 12px;
}

.schedule-item h3 {
    margin: 0 0 8px;
}

.schedule-photo {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}

.meta {
    color: #aaa;
    font-size: 13px;
    line-height: 1.7;
}

.badge {
    display: inline-block;
    background: #b00000;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    margin: 5px 0;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.edit {
    flex: 1;
    background: #333;
}

.delete {
    flex: 1;
    background: #800000;
}

.status {
    display: none;
    background: #202020;
    border: 1px solid #333;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 15px;
}

@media(max-width: 600px) {

    .member-row {
        grid-template-columns: 1fr;
    }

    .remove-member {
        width: 100%;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Admin Schedule</h1>
    <p>Kelola jadwal pertunjukan Visioner48</p>
</header>

<div class="container">

<a href="schedule.html" class="back">
    ← Lihat Schedule
</a>

<div id="status" class="status"></div>

<div class="form-box">

<h2 id="formTitle">Tambah Schedule</h2>

<label>Nama Pertunjukan</label>
<input
    id="title"
    type="text"
    placeholder="Contoh: Pajama Drive"
/>

<label>Tim yang Tampil</label>

<select id="team">
    <option value="Team Love">Team Love</option>
    <option value="Team Dream">Team Dream</option>
    <option value="Team Passion">Team Passion</option>
    <option value="Trainee">Trainee</option>
    <option value="JKT48">JKT48</option>
</select>

<label>Jenis Pertunjukan</label>

<select id="type">
    <option value="SHOW">SHOW</option>
    <option value="STS">STS</option>
    <option value="LAST SHOW">LAST SHOW</option>
     <option value="LAST SHOW">EXCLUSIVE</option>
</select>

<label>Tanggal</label>
<input id="date" type="date">

<label>Waktu</label>
<input id="time" type="time">

<label>Foto Pertunjukan</label>

<!-- Input Galeri -->
<input
    id="imageFile"
    type="file"
    accept="image/*"
>

<label
    for="imageFile"
    class="gallery-button"
>
    📷 Pilih Foto dari Galeri
</label>

<div class="image-status" id="imageStatus">
    Belum memilih foto
</div>

<div id="preview" class="preview">
    <img id="previewImage" src="" alt="Preview">
</div>

<label>
    Link "Lihat Selengkapnya di JKT48"
</label>

<input
    id="jktLink"
    type="url"
    placeholder="https://jkt48.com/..."
>

<label>Line Up Member</label>

<div id="lineup"></div>

<button
    type="button"
    class="add-member"
    onclick="addMember()"
>
    + Tambah Member
</button>

<button
    type="button"
    class="save"
    onclick="saveSchedule()"
>
    💾 Simpan Schedule
</button>

<button
    type="button"
    id="cancelButton"
    class="cancel"
    onclick="cancelEdit()"
>
    Batal Edit
</button>

</div>


<div class="list-box">

<h2>Schedule Tersimpan</h2>

<div id="scheduleList">
    Memuat schedule...
</div>

</div>

</div>


<script>

/* =========================================
   FIREBASE
========================================= */

const FIREBASE_URL =
"https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app";

const DATABASE_PATH =
"visioner48_schedule";


/* =========================================
   ELEMENT
========================================= */

const titleInput =
document.getElementById("title");

const teamInput =
document.getElementById("team");

const typeInput =
document.getElementById("type");

const dateInput =
document.getElementById("date");

const timeInput =
document.getElementById("time");

const imageFile =
document.getElementById("imageFile");

const imageStatus =
document.getElementById("imageStatus");

const preview =
document.getElementById("preview");

const previewImage =
document.getElementById("previewImage");

const jktLinkInput =
document.getElementById("jktLink");

const lineupBox =
document.getElementById("lineup");

const scheduleList =
document.getElementById("scheduleList");

const statusBox =
document.getElementById("status");


let schedules = {};

let editingId = null;

let selectedImage = "";


/* =========================================
   PILIH FOTO GALERI
========================================= */

imageFile.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            alert(
                "File yang dipilih bukan gambar."
            );

            return;
        }


        imageStatus.textContent =
            "Memproses foto...";


        const reader =
            new FileReader();


        reader.onload = function(e) {

            selectedImage =
                e.target.result;


            previewImage.src =
                selectedImage;


            preview.style.display =
                "block";


            imageStatus.textContent =
                "Foto berhasil dipilih: " +
                file.name;

        };


        reader.onerror = function() {

            imageStatus.textContent =
                "Gagal membaca foto.";

        };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   STATUS
========================================= */

function showStatus(message) {

    statusBox.textContent =
        message;

    statusBox.style.display =
        "block";

    setTimeout(function() {

        statusBox.style.display =
            "none";

    }, 3000);

}


/* =========================================
   TAMBAH MEMBER
========================================= */

function addMember(
    name = "",
    link = ""
) {

    const row =
        document.createElement("div");

    row.className =
        "member-row";


    row.innerHTML = `

        <input
            type="text"
            class="member-name"
            placeholder="Nama member"
            value="${escapeHTML(name)}"
        >

        <input
            type="url"
            class="member-link"
            placeholder="member-detail.html?member=..."
            value="${escapeHTML(link)}"
        >

        <button
            type="button"
            class="remove-member"
        >
            ×
        </button>

    `;


    row.querySelector(
        ".remove-member"
    ).addEventListener(
        "click",
        function() {

            row.remove();

        }
    );


    lineupBox.appendChild(row);

}


/* =========================================
   AMBIL LINEUP
========================================= */

function getLineup() {

    const rows =
        lineupBox.querySelectorAll(
            ".member-row"
        );


    const result = [];


    rows.forEach(function(row) {

        const name =
            row.querySelector(
                ".member-name"
            ).value.trim();


        const link =
            row.querySelector(
                ".member-link"
            ).value.trim();


        if (!name) {
            return;
        }


        result.push({

            name: name,

            link:
                link ||
                "member-detail.html?member=" +
                encodeURIComponent(name)

        });

    });


    return result;

}


/* =========================================
   SIMPAN SCHEDULE
========================================= */

async function saveSchedule() {

    const title =
        titleInput.value.trim();


    const date =
        dateInput.value;


    const time =
        timeInput.value;


    if (!title) {

        alert(
            "Nama pertunjukan belum diisi."
        );

        return;

    }


    if (!date) {

        alert(
            "Tanggal belum diisi."
        );

        return;

    }


    if (!time) {

        alert(
            "Waktu belum diisi."
        );

        return;

    }


    /*
       Kalau sedang edit dan
       tidak memilih foto baru,
       gunakan foto lama.
    */

    const data = {

        title: title,

        team:
            teamInput.value,

        type:
            typeInput.value,

        date: date,

        time: time,

        image:
            selectedImage || "",

        jktLink:
            jktLinkInput.value.trim(),

        lineup:
            getLineup(),

        updatedAt:
            Date.now()

    };


    try {

        let url;


        if (editingId) {

            /*
               Jangan menghapus foto lama
               kalau admin tidak memilih
               foto baru.
            */

            if (!selectedImage &&
                schedules[editingId] &&
                schedules[editingId].image) {

                data.image =
                    schedules[editingId].image;

            }


            url =
                FIREBASE_URL +
                "/" +
                DATABASE_PATH +
                "/" +
                editingId +
                ".json";

        } else {

            const id =
                "schedule_" +
                Date.now();


            url =
                FIREBASE_URL +
                "/" +
                DATABASE_PATH +
                "/" +
                id +
                ".json";


            data.createdAt =
                Date.now();

        }


        showStatus(
            "Menyimpan schedule..."
        );


        const response =
            await fetch(
                url,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)

                }
            );


        if (!response.ok) {

            throw new Error(
                "Firebase menolak data."
            );

        }


        if (editingId) {

            showStatus(
                "Schedule berhasil diperbarui."
            );

        } else {

            showStatus(
                "Schedule berhasil ditambahkan."
            );

        }
}

    catch(error) {

        console.error(error);


        alert(
            "Gagal menyimpan schedule.\n\n" +
            error.message
        );

    }

}


/* =========================================
   LOAD SCHEDULE
========================================= */

async function loadSchedules() {

    scheduleList.innerHTML =
        "Memuat schedule...";


    try {

        const response =
            await fetch(
                FIREBASE_URL +
                "/" +
                DATABASE_PATH +
                ".json"
            );


        if (!response.ok) {

            throw new Error(
                "Gagal membaca Firebase."
            );

        }


        const data =
            await response.json();


        schedules =
            data || {};


        renderSchedules();

    }

    catch(error) {

        console.error(error);


        scheduleList.innerHTML = `

            <div style="color:#ff7777;">
                Gagal membaca data Firebase.
            </div>

        `;

    }

}


/* =========================================
   RENDER
========================================= */

function renderSchedules() {

    const items =
        Object.entries(schedules);


    if (!items.length) {

        scheduleList.innerHTML = `

            <div style="color:#888;">
                Belum ada schedule.
            </div>

        `;

        return;

    }


    items.sort(
        function(a, b) {

            const dateA =
                (a[1].date || "") +
                " " +
                (a[1].time || "");


            const dateB =
                (b[1].date || "") +
                " " +
                (b[1].time || "");


            return dateA.localeCompare(
                dateB
            );

        }
    );


    scheduleList.innerHTML =
        items.map(
            function([id, item]) {

                const lineup =
                    Array.isArray(
                        item.lineup
                    )
                    ? item.lineup
                    : [];


                const lineupText =
                    lineup.map(
                        function(member) {

                            return typeof member === "string"
                                ? member
                                : member.name;

                        }
                    ).join(", ");


                return `

                    <div
                        class="schedule-item"
                    >

                        ${
                            item.image
                            ? `
                                <img
                                    class="schedule-photo"
                                    src="${item.image}"
                                    alt="Foto Schedule"
                                >
                              `
                            : ""
                        }


                        <h3>
                            ${escapeHTML(
                                item.title || "-"
                            )}
                        </h3>


                        <span class="badge">
                            ${escapeHTML(
                                item.type || "SHOW"
                            )}
                        </span>


                        <div class="meta">

                            Tim:
                            ${escapeHTML(
                                item.team || "-"
                            )}

                            <br>

                            Tanggal:
                            ${escapeHTML(
                                item.date || "-"
                            )}

                            <br>

                            Waktu:
                            ${escapeHTML(
                                item.time || "-"
                            )}

                            <br>

                            Line Up:
                            ${escapeHTML(
                                lineupText || "-"
                            )}

                        </div>


                        <div class="actions">

                            <button
                                type="button"
                                class="edit"
                                onclick="editSchedule('${escapeHTML(id)}')"
                            >
                                Edit
                            </button>


                            <button
                                type="button"
                                class="delete"
                                onclick="deleteSchedule('${escapeHTML(id)}')"
                            >
                                Hapus
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================
   EDIT
========================================= */

function editSchedule(id) {

    const item =
        schedules[id];


    if (!item) {
        return;
    }


    editingId =
        id;


    titleInput.value =
        item.title || "";


    teamInput.value =
        item.team || "Team Love";


    typeInput.value =
        item.type || "SHOW";


    dateInput.value =
        item.date || "";


    timeInput.value =
        item.time || "";


    jktLinkInput.value =
        item.jktLink || "";


    /*
       Ambil foto lama
    */

    selectedImage =
        item.image || "";


    if (selectedImage) {

        previewImage.src =
            selectedImage;


        preview.style.display =
            "block";


        imageStatus.textContent =
            "Foto schedule tersimpan. " +
            "Pilih foto baru jika ingin mengganti.";

    } else {

        preview.style.display =
            "none";


        imageStatus.textContent =
            "Belum memilih foto";

    }


    /*
       Lineup
    */

    lineupBox.innerHTML =
        "";


    const lineup =
        Array.isArray(item.lineup)
        ? item.lineup
        : [];


    if (lineup.length) {

        lineup.forEach(
            function(member) {

                if (
                    typeof member ===
                    "string"
                ) {

                    addMember(
                        member,
                        ""
                    );

                } else {

                    addMember(
                        member.name || "",
                        member.link || ""
                    );

                }

            }
        );

    } else {

        addMember();

    }


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Schedule";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================
   HAPUS
========================================= */

async function deleteSchedule(id) {

    const item =
        schedules[id];


    if (!item) {
        return;
    }


    const yakin =
        confirm(
            "Hapus schedule \"" +
            (item.title || "") +
            "\"?"
        );


    if (!yakin) {
        return;
    }


    try {

        const response =
            await fetch(

                FIREBASE_URL +
                "/" +
                DATABASE_PATH +
                "/" +
                id +
                ".json",

                {
                    method:
                        "DELETE"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Gagal menghapus data."
            );

        }


        showStatus(
            "Schedule berhasil dihapus."
        );


        loadSchedules();

    }

    catch(error) {

        console.error(error);


        alert(
            "Gagal menghapus schedule.\n\n" +
            error.message
        );

    }

}


/* =========================================
   RESET FORM
========================================= */

function resetForm() {

    editingId =
        null;


    selectedImage =
        "";


    titleInput.value =
        "";


    teamInput.value =
        "Team Love";


    typeInput.value =
        "SHOW";


    dateInput.value =
        "";


    timeInput.value =
        "";


    imageFile.value =
        "";


    jktLinkInput.value =
        "";


    lineupBox.innerHTML =
        "";


    addMember();


    preview.style.display =
        "none";


    previewImage.src =
        "";


    imageStatus.textContent =
        "Belum memilih foto";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Tambah Schedule";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* =========================================
   BATAL EDIT
========================================= */

function cancelEdit() {

    resetForm();

}


/* =========================================
   MULAI
========================================= */

resetForm();

loadSchedules();

</script>

</body>
</html>
