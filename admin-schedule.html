<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Schedule - Visioner48</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

header {
    background: #000;
    border-bottom: 2px solid #e00000;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #ff2020;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.box {
    background: #151515;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.box h2 {
    margin-top: 0;
    color: #ff2020;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0b0b;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #e00000;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff2020;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.success {
    display: block;
    background: #123d1b;
    color: #7cff91;
}

.error {
    display: block;
    background: #450f0f;
    color: #ff7777;
}

.schedule-item {
    background: #0d0d0d;
    border: 1px solid #333;
    border-left: 4px solid #e00000;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.schedule-item h3 {
    margin: 0 0 10px;
    color: #ff3030;
}

.schedule-item p {
    margin: 6px 0;
    color: #ccc;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.actions button,
.actions a {
    width: auto;
    margin: 0;
    padding: 10px 14px;
    text-decoration: none;
    border-radius: 7px;
}

.delete {
    background: #8b0000;
}

.link {
    background: #333;
    color: white;
}

.empty {
    text-align: center;
    color: #888;
    padding: 20px;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: white;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>ADMIN SCHEDULE</h1>
    <a href="admin.html" class="back">← Kembali ke Admin</a>
</header>

<div class="container">

    <div class="box">

        <h2>Tambah Jadwal</h2>

        <label>Tanggal</label>
        <input type="date" id="date">

        <label>Jam</label>
        <input type="time" id="time">

        <label>Judul</label>
        <input
            type="text"
            id="title"
            placeholder="Contoh: JKT48 Theater">

        <label>Jenis</label>

        <select id="type">
            <option value="SHOW">SHOW</option>
            <option value="EVENT">EVENT</option>
            <option value="LIVE">LIVE</option>
            <option value="OTHER">OTHER</option>
        </select>

        <label>Lokasi</label>

        <input
            type="text"
            id="location"
            placeholder="Contoh: JKT48 Theater">

        <label>Link JKT48</label>

        <input
            type="url"
            id="link"
            placeholder="https://jkt48.com/...">

        <label>Deskripsi</label>

        <textarea
            id="description"
            placeholder="Deskripsi jadwal..."></textarea>

        <button id="saveBtn">
            TAMBAH JADWAL
        </button>

        <div id="status" class="status"></div>

    </div>


    <div class="box">

        <h2>Daftar Jadwal</h2>

        <div id="scheduleList">
            <div class="empty">
                Memuat jadwal...
            </div>
        </div>

    </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDvHngeBgcjPgdIVtlR5w_3apGiornP-W4",

    authDomain:
        "visioner48-9b51e.firebaseapp.com",

    databaseURL:
        "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
        "visioner48-9b51e",

    storageBucket:
        "visioner48-9b51e.firebasestorage.app",

    messagingSenderId:
        "691930246088",

    appId:
        "1:691930246088:web:efd50a623e8321d97feefd"
};


/* =========================
   CONNECT
========================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const scheduleRef =
    ref(db, "visioner48_schedule");


/* =========================
   ELEMENT
========================= */

const saveBtn =
    document.getElementById("saveBtn");

const status =
    document.getElementById("status");

const scheduleList =
    document.getElementById("scheduleList");


/* =========================
   STATUS
========================= */

function showStatus(message, type) {

    status.textContent = message;

    status.className =
        "status " + type;

}


/* =========================
   TAMBAH JADWAL
========================= */

saveBtn.addEventListener("click", async () => {

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const title =
        document.getElementById("title").value.trim();

    const type =
        document.getElementById("type").value;

    const location =
        document.getElementById("location").value.trim();

    const link =
        document.getElementById("link").value.trim();

    const description =
        document.getElementById("description").value.trim();


    if (!date) {

        showStatus(
            "Tanggal belum diisi!",
            "error"
        );

        return;
    }


    if (!time) {

        showStatus(
            "Jam belum diisi!",
            "error"
        );

        return;
    }


    if (!title) {

        showStatus(
            "Judul belum diisi!",
            "error"
        );

        return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
        "MENYIMPAN...";


    try {

        await push(
            scheduleRef,
            {
                date: date,
                time: time,
                title: title,
                type: type,
                location: location,
                link: link,
                description: description,
                createdAt: Date.now()
            }
        );


        showStatus(
            "✓ Jadwal berhasil ditambahkan!",
            "success"
        );


        document.getElementById("date").value = "";

        document.getElementById("time").value = "";

        document.getElementById("title").value = "";

        document.getElementById("location").value = "";

        document.getElementById("link").value = "";

        document.getElementById("description").value = "";


    } catch (error) {

        console.error(error);

        showStatus(
            "Gagal menyimpan: " +
            error.message,
            "error"
        );

    }


    saveBtn.disabled = false;

    saveBtn.textContent =
        "TAMBAH JADWAL";

});


/* =========================
   TAMPILKAN DATA
========================= */

onValue(
    scheduleRef,
    (snapshot) => {

        scheduleList.innerHTML = "";


        if (!snapshot.exists()) {

            scheduleList.innerHTML = `
                <div class="empty">
                    Belum ada jadwal.
                </div>
            `;

            return;
        }


        const schedules =
            snapshot.val();


        const items =
            Object.entries(schedules);


        items.sort(
            (a, b) => {

                const A =
                    a[1].date +
                    " " +
                    a[1].time;

                const B =
                    b[1].date +
                    " " +
                    b[1].time;

                return A.localeCompare(B);
            }
        );


        items.forEach(
            ([id, item]) => {

                const div =
                    document.createElement("div");

                div.className =
                    "schedule-item";


                div.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            item.title || "-"
                        )}
                    </h3>

                    <p>
                        📅 ${item.date || "-"}
                    </p>

                    <p>
                        🕐 ${item.time || "-"}
                    </p>

                    <p>
                        📌 ${item.type || "-"}
                    </p>

                    <p>
                        📍 ${
                            escapeHTML(
                                item.location || "-"
                            )
                        }
                    </p>

                    ${
                        item.description
                        ?
                        `
                        <p>
                            ${escapeHTML(
                                item.description
                            )}
                        </p>
                        `
                        :
                        ""
                    }

                    <div class="actions">

                        ${
                            item.link
                            ?
                            `
                            <a
                                class="link"
                                href="${escapeAttribute(item.link)}"
                                target="_blank">
                                Buka Link
                            </a>
                            `
                            :
                            ""
                        }

                        <button
                            class="delete"
                            data-id="${id}">
                            Hapus
                        </button>

                    </div>
                `;


                const deleteButton =
                    div.querySelector(
                        ".delete"
                    );


                deleteButton.addEventListener(
                    "click",
                    () => {

                        hapusJadwal(id);

                    }
                );


                scheduleList.appendChild(div);

            }
        );

    },
    (error) => {

        console.error(error);

        scheduleList.innerHTML = `

            <div class="empty"
                 style="color:#ff5555">

                Gagal membaca database:<br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }
);


/* =========================
   HAPUS
========================= */

async function hapusJadwal(id) {

    const yakin =
        confirm(
            "Yakin ingin menghapus jadwal ini?"
        );


    if (!yakin) return;


    try {

        await remove(
            ref(
                db,
                "visioner48_schedule/" + id
            )
        );


        showStatus(
            "✓ Jadwal berhasil dihapus!",
            "success"
        );


    } catch (error) {

        console.error(error);

        showStatus(
            "Gagal menghapus: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   SECURITY HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return String(value)
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
