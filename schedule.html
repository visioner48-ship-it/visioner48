<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visioner48 - Schedule</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: #fff;
}

.header {
    background: linear-gradient(135deg, #000000, #180000, #b00000);
    padding: 25px 15px;
    text-align: center;
    border-bottom: 2px solid #e00000;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.header p {
    margin: 7px 0 0;
    color: #ddd;
    font-size: 14px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 20px 15px 40px;
}

.back-home {
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background: #b00000;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    margin-bottom: 20px;
}

.back-home:hover {
    background: #e00000;
}

.schedule-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 18px;
}

.schedule-card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.schedule-card:hover {
    transform: translateY(-3px);
    border-color: #d00000;
}

.poster {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #1a1a1a;
    overflow: hidden;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card-info {
    padding: 15px;
}

.team {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
}

.type {
    display: inline-block;
    background: #b00000;
    color: #fff;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 10px;
}

.type.sts {
    background: #8b0000;
}

.type.last {
    background: #5e0000;
}

.title {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.3;
}

.empty,
.loading,
.error {
    text-align: center;
    padding: 40px 15px;
    color: #aaa;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 999;
    overflow-y: auto;
    padding: 25px 15px;
}

.modal.show {
    display: block;
}

.modal-box {
    width: 100%;
    max-width: 650px;
    margin: auto;
    background: #111;
    border: 1px solid #333;
    border-radius: 18px;
    overflow: hidden;
}

.modal-poster {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #1a1a1a;
}

.modal-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.modal-content {
    padding: 20px;
}

.close {
    float: right;
    border: 0;
    background: #333;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

.detail-title {
    font-size: 25px;
    font-weight: bold;
    margin: 5px 50px 18px 0;
}

.detail-row {
    border-bottom: 1px solid #292929;
    padding: 12px 0;
}

.detail-label {
    color: #999;
    font-size: 12px;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 16px;
    font-weight: bold;
}

.lineup {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 10px;
}

.member-link {
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background: #202020;
    border: 1px solid #3a3a3a;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
}

.member-link:hover {
    background: #b00000;
    border-color: #e00000;
}

.jkt-link {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #c00000;
    color: #fff;
    padding: 13px;
    border-radius: 10px;
    margin-top: 20px;
    font-weight: bold;
}

.jkt-link:hover {
    background: #e00000;
}

@media(max-width: 500px) {
    .header h1 {
        font-size: 25px;
    }

    .schedule-list {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Schedule</h1>
    <p>Jadwal pertunjukan JKT48</p>
</header>

<div class="container">

    <a href="index.html" class="back-home">
        ← Kembali ke Home
    </a>

    <div id="scheduleList" class="schedule-list">
        <div class="loading">Memuat jadwal...</div>
    </div>

</div>

<div id="modal" class="modal">
    <div class="modal-box">

        <div class="modal-poster">
            <img id="detailImage" src="" alt="Poster pertunjukan">
        </div>

        <div class="modal-content">

            <button class="close" onclick="closeDetail()">×</button>

            <div id="detailTitle" class="detail-title"></div>

            <div class="detail-row">
                <div class="detail-label">TIM</div>
                <div id="detailTeam" class="detail-value"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">JENIS PERTUNJUKAN</div>
                <div id="detailType" class="detail-value"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">TANGGAL</div>
                <div id="detailDate" class="detail-value"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">WAKTU</div>
                <div id="detailTime" class="detail-value"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">LINE UP MEMBER</div>

                <div id="detailLineup" class="lineup"></div>
            </div>

            <a
                id="jktLink"
                class="jkt-link"
                href="#"
                target="_blank"
                rel="noopener"
            >
                Lihat selengkapnya di JKT48
            </a>

        </div>
    </div>
</div>

<script>
const FIREBASE_URL =
"https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app";

const DATABASE_PATH = "visioner48_schedule";

const list = document.getElementById("scheduleList");

let schedules = {};

function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(dateString) {

    if (!dateString) return "-";

    const parts = dateString.split("-");

    if (parts.length !== 3) return dateString;

    const date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

    return date.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function typeClass(type) {

    if (type === "STS") return "sts";

    if (type === "LAST SHOW") return "last";

    return "";
}

function normalizeLineup(lineup) {

    if (!lineup) return [];

    if (Array.isArray(lineup)) {
        return lineup;
    }

    return Object.values(lineup);
}

async function loadSchedule() {

    try {

        const response = await fetch(
            FIREBASE_URL + "/" + DATABASE_PATH + ".json"
        );

        if (!response.ok) {
            throw new Error("Gagal mengambil data Firebase");
        }

        const data = await response.json();

        schedules = data || {};

        renderSchedule();

    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <div class="error">
                Gagal membaca jadwal.
                <br><br>
                Pastikan Firebase Rules sudah benar.
            </div>
        `;
    }
}

function renderSchedule() {

    const items = Object.entries(schedules);

    if (!items.length) {

        list.innerHTML = `
            <div class="empty">
                Belum ada jadwal pertunjukan.
            </div>
        `;

        return;
    }

    items.sort((a, b) => {

        const dateA =
            (a[1].date || "") + " " + (a[1].time || "");

        const dateB =
            (b[1].date || "") + " " + (b[1].time || "");

        return dateA.localeCompare(dateB);

    });

    list.innerHTML = items.map(([id, item]) => {

        const type = item.type || "SHOW";

        return `
            <div class="schedule-card"
                 onclick="openDetail('${escapeHTML(id)}')">

                <div class="poster">

                    <img
                        src="${escapeHTML(item.image || "https://via.placeholder.com/800x450?text=Visioner48")}"
                        alt="${escapeHTML(item.title || "Pertunjukan")}"
                        onerror="this.src='https://via.placeholder.com/800x450?text=Visioner48'"
                    >

                </div>

                <div class="card-info">

                    <div class="team">
                        ${escapeHTML(item.team || "JKT48")}
                    </div>

                    <div class="type ${typeClass(type)}">
                        ${escapeHTML(type)}
                    </div>

                    <div class="title">
                        ${escapeHTML(item.title || "Pertunjukan")}
                    </div>

                </div>

            </div>
        `;

    }).join("");
}

function openDetail(id) {

    const item = schedules[id];

    if (!item) return;

    document.getElementById("detailImage").src =
        item.image || "https://via.placeholder.com/800x450?text=Visioner48";

    document.getElementById("detailTitle").textContent =
        item.title || "-";

    document.getElementById("detailTeam").textContent =
        item.team || "-";

    document.getElementById("detailType").textContent =
        item.type || "SHOW";

    document.getElementById("detailDate").textContent =
        formatDate(item.date);

    document.getElementById("detailTime").textContent =
        item.time ? item.time + " WIB" : "-";

    const lineupBox =
        document.getElementById("detailLineup");

    const lineup = normalizeLineup(item.lineup);

    if (!lineup.length) {

        lineupBox.innerHTML =
            `<span style="color:#888;">Belum ada line up.</span>`;

    } else {

        lineupBox.innerHTML = lineup.map(member => {

            let name = "";
            let link = "";

            if (typeof member === "string") {

                name = member;

            } else {

                name = member.name || "Member";
                link = member.link || "";
            }

            if (!link) {

                link =
                    "member-detail.html?member=" +
                    encodeURIComponent(name);
            }

            return `
                <a
                    class="member-link"
                    href="${escapeHTML(link)}"
                    onclick="event.stopPropagation()"
                >
                    ${escapeHTML(name)}
                </a>
            `;

        }).join("");
    }

    const jktLink =
        document.getElementById("jktLink");

    if (item.jktLink) {

        jktLink.href = item.jktLink;
        jktLink.style.display = "block";

    } else {

        jktLink.style.display = "none";
    }

    document.getElementById("modal")
        .classList.add("show");

    document.body.style.overflow = "hidden";
}

function closeDetail() {

    document.getElementById("modal")
        .classList.remove("show");

    document.body.style.overflow = "";
}

document.getElementById("modal")
    .addEventListener("click", function(e) {

        if (e.target === this) {
            closeDetail();
        }

    });

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {
        closeDetail();
    }

});

loadSchedule();
</script>

</body>
</html>
