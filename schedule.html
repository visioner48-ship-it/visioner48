 <!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Schedule - Visioner48</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
}

header {
    background: #111;
    border-bottom: 2px solid #e00000;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #ff1a1a;
}

.container {
    width: 94%;
    max-width: 800px;
    margin: 20px auto;
}

#status {
    background: #151515;
    border: 1px solid #333;
    border-left: 4px solid #e00000;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.schedule-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.schedule-card {
    background: #151515;
    border: 1px solid #333;
    border-left: 5px solid #e00000;
    border-radius: 12px;
    padding: 18px;
}

.schedule-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 12px;
    color: white;
}

.schedule-date {
    color: #ff2020;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.schedule-info {
    color: #ccc;
    margin: 7px 0;
}

.schedule-info strong {
    color: white;
}

.schedule-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 15px;
    background: #e00000;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.empty {
    background: #151515;
    padding: 30px;
    text-align: center;
    color: #aaa;
    border-radius: 12px;
}

.kembali-home {
    display: block;
    width: fit-content;
    margin: 15px auto;
    padding: 10px 18px;
    background: #e00000;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.kembali-home:hover {
    background: #ff2020;
}

.error {
    color: #ff3030;
}

</style>

</head>

<body>

<header>

    <h1>Schedule JKT48</h1>

</header>

 <a href="index.html" class="kembali-home">
    ← Kembali ke Home
</a>


<div class="container">

    <div id="status">
        Memuat jadwal...
    </div>

    <div
        id="scheduleList"
        class="schedule-list">
    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDvHngeBgcjPgdIVtlR5w_3apGiornP-W4",

    authDomain:
        "visioner48-9b51e.firebaseapp.com",

    databaseURL:
        "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app/",

    projectId:
        "visioner48-9b51e",

    storageBucket:
        "visioner48-9b51e.firebasestorage.app",

    messagingSenderId:
        "691930246088",

    appId:
        "1:691930246088:web:efd50a623e8321d97feefd"
};


/* =========================
   HUBUNGKAN FIREBASE
========================= */

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================
   AMBIL SCHEDULE
========================= */

const scheduleRef =
    db.ref("visioner48_schedule");


scheduleRef.on(
    "value",

    function(snapshot) {

        const status =
            document.getElementById("status");

        const list =
            document.getElementById("scheduleList");


        list.innerHTML = "";


        if (!snapshot.exists()) {

            status.innerHTML =
                "Belum ada jadwal.";

            list.innerHTML = `
                <div class="empty">
                    Belum ada jadwal yang tersedia.
                </div>
            `;

            return;
        }


        status.innerHTML =
            "Jadwal berhasil dimuat.";


        const data =
            snapshot.val();


        Object.keys(data).forEach(
            function(key) {

                const item =
                    data[key];


                const title =
                    item.title ||
                    item.name ||
                    item.event ||
                    "Jadwal JKT48";


                const date =
                    item.date || "-";


                const time =
                    item.time || "-";


                const location =
                    item.location || "-";


                const link =
                    item.link ||
                    item.url ||
                    item.jkt48Link ||
                    "";


                const card =
                    document.createElement("div");


                card.className =
                    "schedule-card";


                card.innerHTML = `

                    <div class="schedule-title">
                        ${safe(title)}
                    </div>

                    <div class="schedule-date">
                        ${safe(date)}
                    </div>

                    <div class="schedule-info">
                        <strong>Waktu:</strong>
                        ${safe(time)}
                    </div>

                    <div class="schedule-info">
                        <strong>Lokasi:</strong>
                        ${safe(location)}
                    </div>

                    ${
                        link
                        ?
                        `
                        <a
                            class="schedule-link"
                            href="${safe(link)}"
                            target="_blank">
                            Lihat JKT48
                        </a>
                        `
                        :
                        ""
                    }

                `;


                list.appendChild(card);

            }
        );

    },


    function(error) {

        document.getElementById("status")
            .innerHTML = `
                <span class="error">
                    Gagal membaca database:
                    ${safe(error.message)}
                </span>
            `;

        console.error(error);

    }
);


/* =========================
   AMANKAN TEKS
========================= */

function safe(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
