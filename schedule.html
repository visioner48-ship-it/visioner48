<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schedule - Visioner48</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        linear-gradient(
            180deg,
            #000 0%,
            #180000 50%,
            #000 100%
        );
    color:#fff;
}

.header{
    background:#050505;
    border-bottom:1px solid #700000;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
}

.back-home{
    display:inline-block;
    text-decoration:none;
    color:#fff;
    background:#b00000;
    border:1px solid #ff3333;
    padding:10px 15px;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
}

.back-home:hover{
    background:#e00000;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px 15px 40px;
}

.page-title{
    margin:0 0 20px;
    font-size:25px;
    border-left:5px solid #d00000;
    padding-left:12px;
}

.schedule-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.schedule-card{
    display:block;
    text-decoration:none;
    color:#fff;
    background:#090909;
    border:1px solid #650000;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.schedule-card:hover{
    transform:translateY(-3px);
    border-color:#e00000;
    box-shadow:0 8px 25px rgba(150,0,0,.3);
}

.schedule-photo{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    background:#180000;
}

.schedule-content{
    padding:14px;
}

.schedule-title{
    margin:0 0 10px;
    font-size:18px;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.badge{
    background:#260000;
    border:1px solid #650000;
    border-radius:7px;
    padding:6px 8px;
    font-size:11px;
    color:#ddd;
}

.lineup-title{
    margin-top:12px;
    font-size:11px;
    color:#888;
}

.lineup-preview{
    color:#fff;
    font-size:13px;
    line-height:1.5;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#aaa;
}

.empty{
    display:none;
    text-align:center;
    padding:40px 10px;
    color:#999;
}

.error{
    display:none;
    text-align:center;
    padding:25px;
    color:#ff7777;
}

@media(max-width:600px){

    .container{
        padding:15px 10px 30px;
    }

    .schedule-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .schedule-photo{
        height:210px;
    }

    .schedule-title{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a href="index.html" class="back-home">
        ← Kembali ke Home
    </a>

</header>

<main class="container">

    <h1 class="page-title">
        Schedule
    </h1>

    <div id="loading" class="loading">
        Memuat Schedule...
    </div>

    <div id="error" class="error"></div>

    <div id="empty" class="empty">
        Belum ada schedule.
    </div>

    <div id="scheduleGrid" class="schedule-grid"></div>

</main>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "ISI_API_KEY_KAMU",
    authDomain: "visioner48-9b51e.firebaseapp.com",
    databaseURL: "https://visioner48-9b51e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "visioner48-9b51e",
    storageBucket: "visioner48-9b51e.firebasestorage.app",
    messagingSenderId: "ISI_MESSAGING_SENDER_ID",
    appId: "ISI_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();

const DATABASE_PATH =
    "visioner48_schedule";

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const empty =
    document.getElementById("empty");

const scheduleGrid =
    document.getElementById("scheduleGrid");


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function loadSchedules(){

    db.ref(DATABASE_PATH)
        .once("value")
        .then(snapshot => {

            loading.style.display =
                "none";

            const raw =
                snapshot.val();

            if(!raw){

                empty.style.display =
                    "block";

                return;

            }


            const schedules =
                Object.keys(raw).map(key => {

                    return {
                        key:key,
                        ...raw[key]
                    };

                });


            renderSchedules(schedules);

        })
        .catch(err => {

            loading.style.display =
                "none";

            error.textContent =
                "Gagal memuat Schedule: " +
                err.message;

            error.style.display =
                "block";

        });

}


function renderSchedules(schedules){

    scheduleGrid.innerHTML = "";

    schedules.forEach(item => {

        /*
         * INI YANG MENGHUBUNGKAN
         * SCHEDULE.HTML
         * DENGAN
         * SCHEDULE-DETAIL.HTML
         */

        const detailURL =
            "schedule-detail.html?id=" +
            encodeURIComponent(item.key);


        const card =
            document.createElement("a");

        card.className =
            "schedule-card";

        card.href =
            detailURL;


        let photoHTML = "";

        if(item.photo){

            photoHTML = `
                <img
                    class="schedule-photo"
                    src="${escapeHTML(item.photo)}"
                    alt="${escapeHTML(item.title || "Schedule")}"
                >
            `;

        }else{

            photoHTML = `
                <div
                    class="schedule-photo"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#777;
                    "
                >
                    Tidak ada foto
                </div>
            `;

        }


        let lineupText =
            "Belum ada Line Up";


        if(
            Array.isArray(item.lineup) &&
            item.lineup.length
        ){

            lineupText =
                item.lineup
                .map(member => {

                    return member.name || "";

                })
                .filter(Boolean)
                .join(", ");

        }


        card.innerHTML = `

            ${photoHTML}

            <div class="schedule-content">

                <h2 class="schedule-title">
                    ${escapeHTML(
                        item.title ||
                        "Schedule"
                    )}
                </h2>

                <div class="info">

                    ${
                        item.team
                        ? `
                        <span class="badge">
                            ${escapeHTML(item.team)}
                        </span>
                        `
                        : ""
                    }

                    ${
                        item.type
                        ? `
                        <span class="badge">
                            ${escapeHTML(item.type)}
                        </span>
                        `
                        : ""
                    }

                    ${
                        item.date
                        ? `
                        <span class="badge">
                            ${escapeHTML(item.date)}
                        </span>
                        `
                        : ""
                    }

                    ${
                        item.time
                        ? `
                        <span class="badge">
                            ${escapeHTML(item.time)}
                        </span>
                        `
                        : ""
                    }

                </div>

                <div class="lineup-title">
                    LINE UP
                </div>

                <div class="lineup-preview">
                    ${escapeHTML(lineupText)}
                </div>

            </div>

        `;


        scheduleGrid.appendChild(card);

    });

}


loadSchedules();

</script>

</body>
</html>
