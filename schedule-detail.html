<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Detail Schedule - Sieshin48</title>

<style>
*{box-sizing:border-box}
:root{--red:#df001b;--ink:#fff;--blue:rgba(251, 77, 77, 1);--pale:#rgba(112, 4, 4, 1)}
body{margin:0;background:rgba(0, 0, 0, 0.89);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{height:76px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 18px;border-bottom:1px solid #eee;position:sticky;top:0;background:#df001b;z-index:2}
.back{border:0;background:none;text-align:left;padding:8px 0;font-size:17px;color:#111;cursor:pointer;white-space:nowrap}
.heading{text-align:center;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{justify-self:end;background:var(--red);color:white;border:0;border-radius:25px;padding:10px 18px;font-size:16px}
main{max-width:850px;margin:0 auto;padding:25px 20px 45px}
.teamline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.pill{background:#fbe7eb;color:#c60020;border-radius:20px;padding:7px 13px;font-size:14px}
.section-title{font-size:21px;margin:18px 0 18px;font-weight:400}
.period{margin:0 0 22px;padding-left:24px}
.period li{padding-left:4px;margin-bottom:20px;font-size:18px;line-height:1.65}
.period strong{font-weight:700}
.members-title{font-size:21px;margin:22px 0 22px}
.members{display:flex;flex-wrap:wrap;gap:9px 10px;margin-bottom:28px}
.member{border:0;background:#fbe7eb;color:#c60020;border-radius:25px;padding:7px 14px;font-size:17px}
.notice-title{background:var(--blue);color:#fff;font-size:20px;font-weight:700;padding:12px 14px}
.notice{background:var(--pale);padding:13px 14px;font-size:17px;line-height:1.65}
.notice ul{margin:0;padding-left:22px}
.notice li{padding-left:2px;margin-bottom:7px}
.info{margin-top:22px;border-top:1px solid #eee;padding-top:16px;font-size:15px;color:#666;line-height:1.6}
.back-bottom{margin-top:25px;background:var(--red);color:#fff;border:0;border-radius:25px;padding:12px 22px;font-size:16px;cursor:pointer}
.empty{text-align:center;padding:60px 15px}
.empty h2{font-size:22px}
.empty p{color:#666;line-height:1.6}
@media(max-width:480px){
 header{height:62px;padding:0 12px;grid-template-columns:1fr 1.8fr 1fr}
 .back{font-size:15px}
 .heading{font-size:17px}
 .login{font-size:14px;padding:9px 14px}
 main{padding:22px 16px 35px}
 .section-title,.members-title{font-size:19px}
 .period li{font-size:17px;line-height:1.65;margin-bottom:18px}
 .member{font-size:16px;padding:7px 12px}
 .notice-title{font-size:19px}
 .notice{font-size:16px}
}
</style>
</head>

<body>
<header>
  <button class="back" onclick="goBack()"></button>
  <div class="heading" id="headerTitle">Schedule</div>
  <button class="login" onclick="alert('Fitur login belum diaktifkan.')"></button>
</header>

<main id="content"></main>

<script>
const KEY="sieshin48_schedules";

const fallbackSchedule={
 id:"show-love",
 date:"2026-10-02",
 team:"Team Love",
 type:"Show",
 title:"ITADAKI♥LOVE",
 time:"19:00 – 21:00",
 lineup:[
  "Anindya Ramadhani","Aurellia","Aurhel Alana",
  "Cynthia Yaputera","Fiony Alveria","Fritzy Rosmerian",
  "Grace Octaviani","Indah Cahya","Jazlyn Trisha",
  "Michelle Alexandra","Nayla Suji"
 ],
 far:"2026-09-27T21:45",
 farEnd:"2026-09-28T18:00",
 ofc:"2026-09-27T21:45",
 ofcEnd:"2026-09-29T18:00",
 general:"2026-09-28T18:00",
 generalEnd:"2026-09-30T18:00"
};

function getSchedule(){
 let data=[];
 try{
  data=JSON.parse(localStorage.getItem(KEY)||"[]");
 }catch(e){}
 const id=new URLSearchParams(location.search).get("id");
 return data.find(s=>String(s.id)===id)||
        (id===fallbackSchedule.id?fallbackSchedule:null);
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function formatDate(value){
 if(!value)return "Belum ditentukan";
 const d=new Date(value);
 if(isNaN(d.getTime()))return esc(value);
 return d.toLocaleString("id-ID",{
  weekday:"long",day:"2-digit",month:"long",year:"numeric",
  hour:"2-digit",minute:"2-digit",hour12:false
 }).replace(/\./g,":")+" WIB";
}

function periodItem(name,start,end){
 return `<li>${esc(name)}<br>
 ${formatDate(start)} – ${formatDate(end)}</li>`;
}

function render(){
 const s=getSchedule();
 const content=document.getElementById("content");

 if(!s){
  document.getElementById("headerTitle").textContent="Detail Schedule";
  content.innerHTML=`
   <div class="empty">
    <h2>Schedule tidak ditemukan</h2>
    <p>Jadwal ini tidak tersedia di penyimpanan browser. Kembali ke daftar schedule dan pilih jadwal yang tersedia.</p>
    <button class="back-bottom" onclick="goBack()">Kembali ke Schedule</button>
   </div>`;
  return;
 }

 document.title=s.title+" - Sieshin48";
 document.getElementById("headerTitle").textContent=s.title;

 const lineup=Array.isArray(s.lineup)?s.lineup:[];
 const periods=(s.far||s.farEnd||s.ofc||s.ofcEnd||s.general||s.generalEnd)
 ? periodItem("FAR",s.far,s.farEnd)+
   periodItem("OFC",s.ofc,s.ofcEnd)+
   periodItem("General",s.general,s.generalEnd)
 : `<li>Informasi periode pembelian tiket belum diumumkan.</li>`;

 content.innerHTML=`
  <div class="teamline">
   <span class="pill">${esc(s.team||"JKT48")}</span>
   <span class="pill">${esc(s.type||"Show")}</span>
   <span class="pill">${esc(s.date||"Tanggal menyusul")}</span>
  </div>

  <div class="section-title">Periode Pembelian</div>
  <ul class="period">${periods}</ul>

  <div class="members-title">Anggota yang tampil</div>
  <div class="members">
   ${lineup.length
    ?lineup.map(name=>`<span class="member">${esc(name)}</span>`).join("")
    :'<span>Daftar member belum diumumkan.</span>'}
  </div>

  <div class="notice-title">Harap diperhatikan</div>
  <div class="notice">
   <ul>
    <li>Satu email hanya berlaku untuk satu orang.</li>
    <li>Pemesanan dapat dibatalkan apabila nama pada email pemesanan tidak sama dengan nama pada ID.</li>
    <li>Pastikan datang sesuai jadwal dan ketentuan penyelenggara untuk pengambilan tiket.</li>
    <li>Pendaftar perlu mengikuti ketentuan keanggotaan dan pembelian tiket yang berlaku.</li>
    <li>Periksa pengumuman resmi JKT48 untuk informasi harga tiket, ketentuan masuk, dan perubahan jadwal.</li>
   </ul>
  </div>

  <div class="info">
   <strong>${esc(s.title)}</strong><br>
   ${esc(s.date||"Tanggal menyusul")} · ${esc(s.time||"Waktu menyusul")} WIB<br>
   Informasi periode dan ketentuan tiket pada halaman ini merupakan contoh yang dapat kamu sesuaikan.
  </div>

  <button class="back-bottom" onclick="goBack()">Kembali ke Schedule</button>
 `;
}

function goBack(){
 location.href="schedule.html";
}
render();
</script>
</body>
</html>
