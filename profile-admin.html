<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola 60 Profil</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 18px 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        .profile {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .profile h3 {
            margin-top: 0;
        }

        .preview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #ddd;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 15px;
        }

        button:disabled {
            opacity: .6;
        }

        .status {
            margin-top: 8px;
            font-size: 13px;
        }

        .back {
            margin: 15px;
            width: auto;
            padding: 10px 18px;
        }
    </style>
</head>

<body>

<div class="header">
    Kelola 60 Profil Member
</div>

<button
    class="back"
    onclick="kembali()"
>
    Kembali
</button>

<div
    id="profiles"
    class="container"
>
    Memuat profil...
</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

firebase.initializeApp(firebaseConfig);

const database =
    firebase.database();

const storage =
    firebase.storage();

const container =
    document.getElementById("profiles");

const defaultPhoto =
    "https://via.placeholder.com/150";


/* =========================
   BUAT 60 PROFIL
========================= */

for (
    let nomor = 1;
    nomor <= 60;
    nomor++
) {

    buatProfil(nomor);

}


/* =========================
   MEMBUAT PROFIL
========================= */

function buatProfil(nomor) {

    const card =
        document.createElement("div");

    card.className =
        "profile";

    card.innerHTML = `

        <h3>
            Profil ${nomor}
        </h3>

        <img
            id="preview${nomor}"
            class="preview"
            src="${defaultPhoto}"
            alt="Foto Profil ${nomor}"
        >

        <input
            type="text"
            id="name${nomor}"
            placeholder="Nama member"
        >

        <input
            type="file"
            id="photo${nomor}"
            accept="image/*"
        >

        <button
            id="save${nomor}"
            onclick="simpan(${nomor})"
        >
            Simpan Profil ${nomor}
        </button>

        <div
            id="status${nomor}"
            class="status"
        ></div>

    `;

    container.appendChild(card);


    /* Preview foto */

    document
        .getElementById("photo" + nomor)
        .addEventListener(
            "change",
            function() {

                const file =
                    this.files[0];

                if (!file) {
                    return;
                }

                document
                    .getElementById(
                        "preview" + nomor
                    )
                    .src =
                    URL.createObjectURL(file);

            }
        );


    /* Ambil data lama */

    database
        .ref(
            "visioner48_profiles/member" +
            nomor
        )
        .once("value")
        .then(
            function(snapshot) {

                const data =
                    snapshot.val();

                if (!data) {
                    return;
                }

                if (data.nama) {

                    document
                        .getElementById(
                            "name" + nomor
                        )
                        .value =
                        data.nama;

                }

                if (data.foto) {

                    document
                        .getElementById(
                            "preview" + nomor
                        )
                        .src =
                        data.foto;

                }

            }
        )
        .catch(
            function(error) {

                console.log(error);

            }
        );

}


/* =========================
   SIMPAN
========================= */

function simpan(nomor) {

    const nama =
        document
            .getElementById(
                "name" + nomor
            )
            .value
            .trim();

    const file =
        document
            .getElementById(
                "photo" + nomor
            )
            .files[0];

    const button =
        document
            .getElementById(
                "save" + nomor
            );

    const status =
        document
            .getElementById(
                "status" + nomor
            );


    if (!nama) {

        status.textContent =
            "Masukkan nama member.";

        return;

    }


    button.disabled = true;

    status.textContent =
        "Menyimpan...";


    const ref =
        database.ref(
            "visioner48_profiles/member" +
            nomor
        );


    /*
       TANPA FOTO
    */

    if (!file) {

        ref.once("value")
            .then(
                function(snapshot) {

                    const lama =
                        snapshot.val() || {};

                    return ref.set({

                        nama: nama,

                        foto:
                            lama.foto ||
                            defaultPhoto

                    });

                }
            )
            .then(
                function() {

                    status.textContent =
                        "Nama berhasil disimpan.";

                }
            )
            .catch(
                function(error) {

                    status.textContent =
                        "Gagal: " +
                        error.message;

                }
            )
            .finally(
                function() {

                    button.disabled =
                        false;

                }
            );

        return;

    }


    /*
       DENGAN FOTO
    */

    status.textContent =
        "Mengupload foto...";


    const fileName =
        Date.now() +
        "_" +
        file.name;


    const uploadRef =
        storage.ref(
            "visioner48_profiles/member" +
            nomor +
            "/" +
            fileName
        );


    uploadRef
        .put(file)

        .then(
            function(snapshot) {

                status.textContent =
                    "Foto berhasil diupload.";

                return snapshot
                    .ref
                    .getDownloadURL();

            }
        )

        .then(
            function(photoURL) {

                status.textContent =
                    "Menyimpan data...";

                return ref.set({

                    nama: nama,

                    foto: photoURL

                });

            }
        )

        .then(
            function() {

                status.textContent =
                    "Nama dan foto berhasil disimpan.";

            }
        )

        .catch(
            function(error) {

                console.error(error);

                status.textContent =
                    "Gagal: " +
                    error.message;

            }
        )
        .finally(
            function() {

                button.disabled =
                    false;

            }
        );

}


/* =========================
   KEMBALI
========================= */

function kembali() {

    window.location.href =
        "privatechat-owner.html";

}

</script>

</body>
</html>
