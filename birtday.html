<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visioner48 - Ulang Tahun Member</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #312e81);
    color: white;
    min-height: 100vh;
}

.header {
    padding: 20px;
    text-align: center;
}

.home {
    display: inline-block;
    color: white;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.member {
    background: rgba(255,255,255,0.12);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 16px;
    text-align: center;
}

.member img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
}

.member h2 {
    margin: 12px 0 5px;
}

.tanggal {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="header">

    <a href="index.html" class="home">
        ← Home
    </a>

    <h1>
        Ulang Tahun Member
    </h1>

    <p>
        Agustus
    </p>

</div>


<div class="container">

    <!-- HEIDI -->
    <div class="member">

        <img
            src="heidi.jpg"
            alt="Heidi.jpg"
        >

        <h2>
            Heidi
        </h2>

        <div class="tanggal">
            Ulang tahun: 27 Agustus 2026
        </div>

    </div>


    <!-- RARA -->
    <div class="member">

        <img
            src="rara.jpg"
            alt="Rara.jpg"
        >

        <h2>
            Rara
        </h2>

        <div class="tanggal">
            Ulang tahun: 30 Agustus 2026
        </div>

    </div>

</div>

</body>
</html>
