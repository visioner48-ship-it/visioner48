* {

body {

.soal {

.jawaban {

    border-radius: 20px;

    background:
        rgba(255, 255, 255, 0.10);

    color: white;

    text-align: left;
    font-size: 16px;
    cursor: pointer;

    transition: 0.2s;
}

.jawaban:hover {
    background:
        rgba(255, 255, 255, 0.17);
}

.benar {

    border-color: #198754;

.salah {

#hasil {

.nilai {

    font-weight: bold;
    color: white;
}

.btn {
    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    background:
        rgba(255, 255, 255, 0.10);

    color: white;

    padding: 14px 20px;

    border-radius: 20px;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}

.btn:hover {
    transform:
        translateY(-3px);

    background:
        rgba(255, 255, 255, 0.17);
}
</style>
</head>

let soalAktif = [];
let nomorSoal = 0;
let skor = 0;

function acak(array) {

    return array.sort(function() {
        return Math.random() - 0.5;
    });

}

function mulaiQuiz() {

    soalAktif =
        acak([...semuaSoal]).slice(0, 10);

    nomorSoal = 0;
    skor = 0;

    document.getElementById("quiz").style.display =
        "block";

    document.getElementById("hasil").style.display =
        "none";

    tampilkanSoal();

}

function tampilkanSoal() {

    const data =
        soalAktif[nomorSoal];

    document.getElementById("nomor").textContent =
        "Soal " + (nomorSoal + 1) +
        " dari " + soalAktif.length;

    document.getElementById("soal").textContent =
        data.soal;

    const pilihan =
        document.getElementById("pilihan");

    pilihan.innerHTML = "";

    data.pilihan.forEach(function(teks, index) {

        const tombol =
            document.createElement("button");

        tombol.className =
            "jawaban";

        tombol.textContent =
            String.fromCharCode(65 + index) +
            ". " + teks;

        tombol.onclick = function() {

            jawab(tombol, index);

        };

        pilihan.appendChild(tombol);

    });

}

function jawab(tombol, index) {

    const data =
        soalAktif[nomorSoal];

    const semuaTombol =
        document.querySelectorAll(".jawaban");

    semuaTombol.forEach(function(btn) {

        btn.disabled = true;

    });

    if (index === data.jawaban) {

        tombol.classList.add("benar");

        skor++;

    } else {

        tombol.classList.add("salah");

        semuaTombol[
            data.jawaban
        ].classList.add("benar");

    }

    setTimeout(function() {

        nomorSoal++;

        if (nomorSoal < soalAktif.length) {

            tampilkanSoal();

        } else {

            tampilkanHasil();

        }

    }, 800);

}

function tampilkanHasil() {

    document.getElementById("quiz").style.display =
        "none";

    document.getElementById("hasil").style.display =
        "block";

    document.getElementById("benar").textContent =
        skor + " / " + soalAktif.length;

    let nilai =
        Math.round(
            (skor / soalAktif.length) * 100
        );

    document.getElementById("keterangan").textContent =
        "Nilai kamu: " + nilai;

}
