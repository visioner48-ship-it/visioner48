<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tebak48Group - Visioner48</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #000000,
                    #180000,
                    #400000
                );

            background-attachment: fixed;

            min-height: 100vh;

            color: white;

            text-align: center;
        }


        .container {
            max-width: 600px;

            margin: auto;
        }


        h1 {
            margin-bottom: 20px;

            color: white;
        }


        #game,
        #hasil {
            background: #0d0d0d;

            border: 1px solid #b00000;

            padding: 25px;

            border-radius: 20px;

            color: white;

            box-shadow:
                0 0 20px
                rgba(180, 0, 0, 0.25);
        }


        #nomor-soal {
            font-size: 18px;

            margin-bottom: 20px;

            color: #ff3333;
        }


        #soal {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 25px;

            line-height: 1.5;

            color: white;
        }


        #pilihan {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .pilihan-jawaban {
            width: 100%;

            padding: 15px;

            border: 1px solid #700000;

            border-radius: 20px;

            background: #171717;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }


        .pilihan-jawaban:hover {
            background: #2b0000;

            border-color: #ff0000;

            transform:
                translateY(-2px);
        }


        .pilihan-jawaban.benar {
            background: #16803c;

            border-color: #22c55e;

            color: white;
        }


        .pilihan-jawaban.salah {
            background: #a00000;

            border-color: #ff0000;

            color: white;
        }


        .pilihan-jawaban:disabled {
            cursor: default;
        }


        #hasil {
            display: none;
        }


        #hasil h2 {
            margin-top: 0;

            color: white;
        }


        .nilai {
            font-size: 45px;

            font-weight: bold;

            margin: 20px 0;

            color: #ff3333;
        }


        .tombol-hasil {
            width: 100%;

            padding: 15px;

            margin-top: 12px;

            border: 1px solid #b00000;

            border-radius: 20px;

            background: #171717;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
        }


        .tombol-hasil:hover {
            opacity: 1;

            transform:
                translateY(-2px);

            background: #300000;

            border-color: #ff0000;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Tebak 48Group</h1>

    <!-- GAME -->

    <div id="game">

        <div id="nomor-soal">
            Soal 1 dari 5
        </div>

        <div id="soal">
            Memuat soal...
        </div>

        <div id="pilihan">
        </div>

    </div>


    <!-- HASIL -->

    <div id="hasil">

        <h2>Game Selesai!</h2>

        <p>Nilai kamu:</p>

        <div class="nilai" id="nilai">
            0 / 5
        </div>

        <p id="pesan"></p>

        <button
            class="tombol-hasil"
            onclick="mainLagi()">
            Main Lagi
        </button>

        <button
            class="tombol-hasil"
            onclick="kembaliKeGame()">
            Kembali ke Game
        </button>

    </div>

</div>


<script src="siapaaku.js"></script>

</body>
</html>
