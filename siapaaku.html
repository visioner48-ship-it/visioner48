 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tebak48Group - Visioner48</title>

    <style>
        * {
            box-sizing: border-box;
        }

     
body {
    margin: 0;
    padding: 20px;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #312e81
        );

    background-attachment: fixed;

    min-height: 100vh;

    color: white;

    text-align: center;
}

    
.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    margin-bottom: 20px;
    color: white;
}

#game,
#hasil {
    background: rgba(
        255,
        255,
        255,
        0.10
    );

    border: 1px solid rgba(
        255,
        255,
        255,
        0.18
    );

    padding: 25px;

    border-radius: 20px;

    color: white;
}

#nomor-soal {
    font-size: 18px;
    margin-bottom: 20px;
    color: #d1d5db;
}

#soal {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 25px;

    line-height: 1.5;

    color: white;
}

#pilihan {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

      
.pilihan-jawaban {
    width: 100%;

    padding: 15px;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 20px;

    background:
        rgba(255, 255, 255, 0.10);

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}

.pilihan-jawaban:hover {
    background:
        rgba(255, 255, 255, 0.17);

    transform:
        translateY(-2px);
}

.pilihan-jawaban.benar {
    background: #22c55e;
    color: white;
}

.pilihan-jawaban.salah {
    background: #ef4444;
    color: white;
}

.pilihan-jawaban:disabled {
    cursor: default;
}

#hasil {
    display: none;
}

#hasil h2 {
    margin-top: 0;
    color: white;
}

.nilai {
    font-size: 45px;
    font-weight: bold;
    margin: 20px 0;
    color: white;
}

.tombol-hasil {
    width: 100%;

    padding: 15px;

    margin-top: 12px;

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 20px;

    background:
        rgba(255, 255, 255, 0.10);

    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;
}

.tombol-hasil:hover {
    opacity: 1;

    transform:
        translateY(-2px);

    background:
        rgba(255, 255, 255, 0.17);
}
    </style>
</head>

<body>

<div class="container">

    <h1>Tebak 48Group</h1>

    <!-- GAME -->

    <div id="game">

        <div id="nomor-soal">
            Soal 1 dari 5
        </div>

        <div id="soal">
            Memuat soal...
        </div>

        <div id="pilihan">
        </div>

    </div>


    <!-- HASIL -->

    <div id="hasil">

        <h2>Game Selesai!</h2>

        <p>Nilai kamu:</p>

        <div class="nilai" id="nilai">
            0 / 5
        </div>

        <p id="pesan"></p>

        <button
            class="tombol-hasil"
            onclick="mainLagi()">
            Main Lagi
        </button>

        <button
            class="tombol-hasil"
            onclick="kembaliKeGame()">
            Kembali ke Game
        </button>

    </div>

</div>


<script src="siapaaku.js"></script>

</body>
</html>
